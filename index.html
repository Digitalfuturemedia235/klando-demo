<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KLANDO | Moto-taxi</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root {
  --green: #123d2b;
  --green2: #1d6042;
  --orange: #f28c28;
  --cream: #f5f7f4;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--cream);
  color: #18231d;
  font-family: Arial, sans-serif;
}

header {
  background: var(--green);
  color: white;
  padding: 20px;
}

.brand {
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 2px;
}

.brand span {
  color: var(--orange);
}

main {
  max-width: 1100px;
  margin: 25px auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
}

button {
  background: var(--green2);
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 8px;
  cursor: pointer;
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 8px 0 15px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<header>
  <div class="brand">KLAN<span>DO</span></div>
  <div>La mobilité urbaine, simplement.</div>
</header>

<main>

<section id="authSection" class="card">

<h2>Bienvenue sur KLANDO</h2>

<p>
Connectez-vous ou créez un compte pour commander
une moto-taxi ou devenir conducteur partenaire.
</p>

<button onclick="showLogin()">Connexion</button>
<button onclick="showRegister()">Créer un compte</button>

<div id="loginForm">
<h3>Connexion</h3>
<input id="loginEmail" type="email" placeholder="Adresse e-mail">
<input id="loginPassword" type="password" placeholder="Mot de passe">
<button onclick="login()">Se connecter</button>
</div>

<div id="registerForm" class="hidden">
<h3>Créer un compte</h3>
<input id="name" placeholder="Nom complet">
<input id="phone" placeholder="Téléphone">
<input id="email" type="email" placeholder="Adresse e-mail">
<input id="password" type="password" placeholder="Mot de passe">

<select id="role">
<option value="customer">Client</option>
<option value="driver">Conducteur</option>
</select>

<button onclick="register()">Créer mon compte</button>
</div>

</section>

<section id="dashboard" class="card hidden">
<h2>Bienvenue sur KLANDO !</h2>
<div id="dashboardContent"></div>
<button onclick="logout()">Déconnexion</button>
</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://mhtzbdopqfibdpowxyxm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_3OyX775wvqnzXQHqY4tcSg_klYZRBwY";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

function showLogin() {
  document.getElementById("loginForm").classList.remove("hidden");
  document.getElementById("registerForm").classList.add("hidden");
}

function showRegister() {
  document.getElementById("registerForm").classList.remove("hidden");
  document.getElementById("loginForm").classList.add("hidden");
}

async function login() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  const {error} = await db.auth.signInWithPassword({
    email,
    password
  });

  if(error) {
    alert(error.message);
    return;
  }

  loadDashboard();
}

async function register() {
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const role = document.getElementById("role").value;

  const {data,error} = await db.auth.signUp({
    email,
    password,
    options: {
      data: {
        display_name: name,
        phone: phone,
        role: role
      }
    }
  });

  if(error) {
    alert(error.message);
    return;
  }

  if(data.session) {
    loadDashboard();
  } else {
    alert("Compte créé ! Vérifiez votre adresse e-mail.");
    showLogin();
  }
}

async function loadDashboard() {
  const {data:{user}} = await db.auth.getUser();

  if(!user) return;

  const {data:profile,error} = await db
    .from("profiles")
    .select("*")
    .eq("id",user.id)
    .single();

  if(error) {
    alert(error.message);
    return;
  }

  document.getElementById("authSection").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  document.getElementById("dashboardContent").innerHTML =
    "<h3>Bonjour " +
    profile.display_name +
    "</h3><p>Votre espace KLANDO : " +
    profile.role +
    "</p>";
}

async function logout() {
  await db.auth.signOut();
  location.reload();
}

db.auth.getSession().then(({data}) => {
  if(data.session) loadDashboard();
});
</script>

</body>
</html>
