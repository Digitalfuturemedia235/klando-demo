<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="E&Bz Mobility – Commandez votre moto-taxi à N'Djaména. Moving People. Connecting Opportunities.">
<meta name="theme-color" content="#0e0e10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E&Bz Mobility">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230e0e10'/%3E%3Ctext x='32' y='47' font-size='42' font-weight='900' text-anchor='middle' fill='%23ff8a00' font-family='Georgia,serif'%3EE%3C/text%3E%3C/svg%3E">
<title>E&Bz Mobility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
<style>
/* =====================================================================
   E&Bz MOBILITY — design system
   Palette: ink (near-black) + signal orange. One radius scale, one shadow
   scale, one icon style (stroke 2px), one font (Plus Jakarta Sans).
   ===================================================================== */
:root{
  --ink:#0e0e10; --ink-2:#17171a; --ink-3:#26262b;
  --orange:#ff8a00; --orange-2:#ffa329; --orange-deep:#d96f00; --orange-soft:#fff1df;
  --bg:#f2f2ef; --card:#ffffff; --line:#e7e6e1; --field:#f7f7f4; --muted:#6b6b72;
  --ok:#1f7a45; --ok-bg:#e8f6ed; --warn:#7a5b00; --warn-bg:#fff5d9; --err:#9b2316; --err-bg:#fdebe8; --red:#c0392b;
  --r-sm:12px; --r-md:16px; --r-lg:22px;
  --sh-1:0 1px 2px rgba(14,14,16,.05),0 8px 24px rgba(14,14,16,.06);
  --sh-2:0 2px 4px rgba(14,14,16,.06),0 18px 44px rgba(14,14,16,.14);
  --font:"Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid rgba(255,138,0,.55);outline-offset:2px}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:10px;min-height:68px;
  padding:12px max(20px,env(safe-area-inset-right)) 12px max(20px,env(safe-area-inset-left));padding-top:max(12px,env(safe-area-inset-top));
  background:rgba(14,14,16,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--orange),rgba(255,138,0,0) 70%)}
header h1{margin:0;flex:1;min-width:0;font-size:21px;font-weight:800;letter-spacing:-.2px;display:flex;align-items:center;gap:12px}
.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;flex:none;background:linear-gradient(145deg,var(--orange-2),#ff7a00);box-shadow:0 6px 16px rgba(255,138,0,.35)}
.logo svg{width:30px;height:30px}
.word{display:block;line-height:1.1;min-width:0}
.brand-accent{color:var(--orange)}
header h1 small{display:block;margin-top:3px;font-size:11px;font-weight:500;letter-spacing:.2px;color:#a9a9b0}
.hbtn{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .2s,border-color .2s,color .2s}
.hbtn:hover{border-color:var(--orange);color:var(--orange)}
.hbtn.solid{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.hbtn.solid:hover{background:var(--orange-2);color:var(--ink)}

main{max-width:1120px;margin:0 auto;padding:22px 16px 8px}

/* ---------- Buttons ---------- */
button{font-family:inherit;cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s,border-color .18s}
button:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
button.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:14px;min-height:50px;padding:13px 20px;border:0;border-radius:var(--r-md);
  background:linear-gradient(180deg,var(--orange-2),var(--orange));color:var(--ink);font-size:15px;font-weight:800;box-shadow:0 8px 20px rgba(255,138,0,.28),inset 0 1px 0 rgba(255,255,255,.35)}
button.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 26px rgba(255,138,0,.36),inset 0 1px 0 rgba(255,255,255,.35)}
button.btn:active:not(:disabled){transform:translateY(0)}
button.btn.alt{background:var(--ink);color:#fff;box-shadow:none}
button.btn.alt:hover:not(:disabled){background:var(--ink-3);box-shadow:0 8px 20px rgba(14,14,16,.2)}
button.btn.red{background:var(--red);color:#fff;box-shadow:none}
button.btn.sm{width:auto;min-height:42px;padding:9px 15px;margin:8px 8px 0 0;font-size:13px;border-radius:var(--r-sm)}

/* ---------- Cards, forms ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin-bottom:20px;box-shadow:var(--sh-1)}
.card h2{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-size:18px;font-weight:800;letter-spacing:-.2px}
.card h2::before{content:"";width:4px;height:20px;border-radius:4px;background:var(--orange);flex:none}
label{display:block;margin:15px 0 6px;font-size:12.5px;font-weight:700;color:#4b4b52;letter-spacing:.1px}
input,select{width:100%;min-height:50px;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--field);color:var(--ink);font:inherit;font-size:16px;transition:border-color .2s,box-shadow .2s,background .2s}
input::placeholder{color:#a3a3aa}
input:focus,select:focus{outline:none;background:#fff;border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,138,0,.16)}
.row{display:flex;gap:8px;align-items:stretch}.row>*{flex:1}
.muted{color:var(--muted);font-size:13px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tabs{display:flex;gap:4px;padding:4px;margin-bottom:12px;background:#ecebe7;border-radius:var(--r-md)}
.tabs button{flex:1;min-height:42px;padding:9px 10px;border:0;border-radius:12px;background:transparent;color:#55555c;font-size:14px;font-weight:700}
.tabs button.on{background:var(--ink);color:#fff;box-shadow:0 4px 12px rgba(14,14,16,.2)}
.msg{display:block;margin:10px 0;padding:12px 14px;border-radius:var(--r-sm);font-size:14px;line-height:1.45;border:1px solid transparent}
.msg.err{background:var(--err-bg);color:var(--err);border-color:#f6cfc9}
.msg.ok{background:var(--ok-bg);color:var(--ok);border-color:#c9e8d4}
.msg.warn{background:var(--warn-bg);color:var(--warn);border-color:#f5e3a8}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800;background:#eee;color:#444;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.pending{background:var(--orange-soft);color:#8a4b00}
.pill.accepted,.pill.approved{background:#dcefff;color:#0a4a82}
.pill.ongoing{background:#e8dcff;color:#4a2a8a}
.pill.completed{background:var(--ok-bg);color:var(--ok)}
.pill.cancelled,.pill.rejected{background:var(--err-bg);color:var(--err)}
.item{padding:15px 4px;border-top:1px solid var(--line);font-size:14px;border-radius:12px;transition:background .15s}
.item:first-child{border-top:0}
.item:hover{background:#fafaf8}
.item .top{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* ---------- Landing (hero + auth) ---------- */
.landing{display:grid;gap:20px;align-items:start;margin-bottom:6px}
.hero{position:relative;overflow:hidden;padding:36px 30px 30px;border-radius:26px;color:#fff;box-shadow:var(--sh-2);
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,138,0,.28),transparent 55%),
             linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/44px 44px,
             linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/44px 44px,
             linear-gradient(135deg,#0e0e10,#1d1d21)}
.hero>*{position:relative;z-index:1}
.hero-art{position:absolute!important;right:-30px;bottom:-10px;width:min(78%,430px);opacity:.9;z-index:0!important;pointer-events:none}
.hero-label{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(255,138,0,.14);border:1px solid rgba(255,138,0,.35);color:var(--orange-2);font-size:11px;font-weight:800;letter-spacing:1.6px}
.hero h2{margin:18px 0 12px;font-size:clamp(30px,5.4vw,46px);line-height:1.08;font-weight:800;letter-spacing:-1.2px;color:#fff}
.hero h2 span{color:var(--orange)}
.hero p{max-width:470px;margin:0;color:rgba(255,255,255,.78);line-height:1.7;font-size:16px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:26px}
.hero-cta .btn{width:auto;margin:0;padding:14px 26px}
.ghost{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:13px 20px;border-radius:var(--r-md);border:1px solid rgba(255,255,255,.28);color:#fff;text-decoration:none;font-weight:700;font-size:15px;transition:border-color .2s,color .2s,background .2s}
.ghost:hover{border-color:var(--orange);color:var(--orange);background:rgba(255,138,0,.08)}
.hero-feats{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 0;padding:0;list-style:none}
.hero-feats li{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:13px;font-weight:600}
.hero-feats .ic{color:var(--orange)}
#installBtn{margin-top:16px;border-color:rgba(255,138,0,.6);color:var(--orange-2)}
#iosHint{margin:10px 0 0;font-size:13px;color:#cfcfd4}
#vAuth .card{margin:0;padding:26px;box-shadow:var(--sh-2)}
#vAuth .card::before{content:"";display:block;height:4px;margin:-26px -26px 22px;border-radius:var(--r-lg) var(--r-lg) 0 0;background:linear-gradient(90deg,var(--orange),var(--orange-2) 50%,var(--ink))}
.auth-title{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px}
.auth-sub{margin:4px 0 18px;color:var(--muted);font-size:14px}

/* ---------- Public home ---------- */
#publicHome{margin-top:34px}
.home-heading{padding:6px 4px 18px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--orange-deep);font-size:11px;font-weight:800;letter-spacing:1.8px}
.home-heading h2{margin:8px 0 4px;font-size:clamp(25px,4.6vw,36px);font-weight:800;letter-spacing:-.9px}
.home-heading p{margin:0;color:var(--muted)}
.map,.home-map{position:relative;z-index:0;isolation:isolate;overflow:hidden;border:1px solid var(--line);background:#e9e8e3}
.map{height:330px;margin:8px 0;border-radius:var(--r-md)}
.home-map{height:52vh;min-height:330px;border-radius:var(--r-lg);box-shadow:var(--sh-2)}
.leaflet-tile-pane{filter:saturate(.7) contrast(1.03)}
.leaflet-control-attribution{max-width:calc(100% - 12px);font-size:10px;border-radius:8px 0 0 0}
.leaflet-bar{border:0!important;box-shadow:var(--sh-1)!important;border-radius:12px!important;overflow:hidden}
.leaflet-bar a{color:var(--ink)!important}
.leaflet-popup-content-wrapper{border-radius:14px;font-family:var(--font);font-weight:600}
.booking-panel{position:relative;z-index:500;margin:-30px 14px 0;padding:22px;border-radius:var(--r-lg);background:#fff;border:1px solid var(--line);border-top:4px solid var(--orange);box-shadow:var(--sh-2)}
.booking-panel h3{margin:0 0 4px;font-size:20px;font-weight:800;letter-spacing:-.3px}
.booking-panel p{margin:0;color:var(--muted)}
.booking-panel .btn{width:auto;padding:13px 24px}
.section-title{margin:44px 4px 16px;font-size:clamp(22px,4vw,30px);font-weight:800;letter-spacing:-.7px;scroll-margin-top:90px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.how-card{position:relative;padding:22px;border-radius:var(--r-lg);background:#fff;border:1px solid var(--line);box-shadow:var(--sh-1)}
.how-num{display:grid;place-items:center;width:42px;height:42px;margin-bottom:14px;border-radius:14px;background:var(--ink);color:var(--orange);font-weight:800;font-size:18px}
.how-card h3{margin:0 0 6px;font-size:17px;font-weight:800}
.how-card p{margin:0;color:var(--muted);font-size:14.5px}
.cta-band{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:26px;padding:26px 28px;border-radius:var(--r-lg);color:#fff;
  background:radial-gradient(90% 140% at 100% 0%,rgba(255,138,0,.3),transparent 60%),linear-gradient(135deg,#0e0e10,#1d1d21);box-shadow:var(--sh-2)}
.cta-band h3{margin:0 0 4px;font-size:21px;font-weight:800;letter-spacing:-.3px}
.cta-band p{margin:0;color:rgba(255,255,255,.75);max-width:480px}
.cta-band .btn{width:auto;margin:0;flex:none}

/* ---------- Customer ---------- */
.fare{font-size:28px;font-weight:800;letter-spacing:-.6px;color:var(--orange-deep);font-variant-numeric:tabular-nums}
.farebox{margin:16px 0 4px;padding:16px 18px;border-radius:var(--r-md);color:#fff;background:linear-gradient(135deg,var(--ink),var(--ink-3))}
.farebox .fare{color:var(--orange)}
.farebox .muted{color:#b4b4bb}
.paypick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.paypick button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:78px;padding:10px 6px;border:2px solid var(--line);border-radius:var(--r-md);background:#fff;color:var(--ink);font-size:13px;font-weight:700;line-height:1.2}
.paypick button .ic{width:24px;height:24px;color:#55555c}
.paypick button:hover:not(:disabled){border-color:#cfcfc9}
.paypick button.on{border-color:var(--orange);background:#fff8ee;box-shadow:0 0 0 4px rgba(255,138,0,.14)}
.paypick button.on .ic{color:var(--orange-deep)}
.paypick button.on::after{content:"";position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--orange)}
#liveCard{grid-column:1/-1;border-top:4px solid var(--orange)}
.steps{display:flex;margin:14px 0 16px}
.step{position:relative;flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--muted);line-height:1.25}
.step:not(:first-child)::before{content:"";position:absolute;top:14px;left:-50%;right:50%;height:3px;border-radius:3px;background:#e4e3de}
.step.done::before,.step.cur::before{background:var(--ink)}
.step i{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:30px;height:30px;margin:0 auto 6px;border-radius:50%;background:#e4e3de;color:#55555c;font-style:normal;font-weight:800;font-size:12px}
.step.done i{background:var(--ink);color:#fff}
.step.cur i{background:var(--orange);color:var(--ink);box-shadow:0 0 0 5px rgba(255,138,0,.25)}
.step.cur span{color:var(--ink);font-weight:800}
.live-line{margin:6px 0 4px;font-size:18px;font-weight:800;letter-spacing:-.3px}
.drv{display:flex;align-items:center;gap:12px;margin:10px 0}
.drv .av{display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--orange);font-weight:800;font-size:20px}
.call{display:inline-flex;align-items:center;gap:8px;margin:6px 8px 6px 0;padding:10px 16px;border-radius:var(--r-sm);background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.call:hover{background:var(--ink-3)}

/* ---------- Map pins (same look everywhere) ---------- */
.mk{display:grid;place-items:center;width:44px;height:44px}
.pin{display:block}
.pin-pick{width:20px;height:20px;border-radius:50%;background:var(--ink);border:5px solid #fff;box-shadow:0 0 0 3px rgba(14,14,16,.2),0 4px 10px rgba(0,0,0,.35)}
.pin-dest{position:relative;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--orange);border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.pin-dest::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--ink)}
.pin-drv{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--orange);border:3px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.pin-drv .ic{width:21px;height:21px}
.pin-drv::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--orange);opacity:0;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.25);opacity:0}}

/* ---------- Admin ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:16px 10px;border-radius:var(--r-md);background:var(--orange-soft);border:1px solid #ffd9aa;text-align:center}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.8px}
.stat span{font-size:11.5px;font-weight:600;color:var(--muted)}
#drvSwitch{padding:12px 16px;border-radius:var(--r-md);background:var(--field);border:1px solid var(--line);font-weight:700}

/* ---------- Toasts ---------- */
#toasts{position:fixed;top:82px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{pointer-events:auto;display:flex;flex-direction:column;gap:2px;padding:13px 16px;border-radius:var(--r-md);background:var(--ink);color:#fff;border-left:5px solid var(--orange);box-shadow:var(--sh-2);font-size:14px;animation:tin .25s ease}
.toast b{color:var(--orange-2);font-size:15px}
.toast.ok{border-left-color:#2ecc71}.toast.ok b{color:#6fe3a0}
.toast.warn{border-left-color:#f1c40f}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* ---------- Footer ---------- */
.footer{margin-top:44px;padding:34px 16px max(30px,env(safe-area-inset-bottom));text-align:center;background:var(--ink);color:#fff;position:relative}
.footer::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--orange),transparent)}
.footer .brand-row{display:flex;align-items:center;justify-content:center;gap:12px;font-size:22px;font-weight:800;letter-spacing:-.3px}
.footer .tag{margin:8px 0 0;color:#b4b4bb;font-size:14px}
.social{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}
.social:empty{display:none}
.social a{padding:8px 15px;border-radius:999px;border:1px solid #3a3a40;color:#fff;text-decoration:none;font-size:13px;font-weight:700}
.social a:hover{border-color:var(--orange);color:var(--orange)}
.footer .init{margin:14px 0 4px;color:var(--orange);font-weight:700;font-size:14px}
.footer small{color:#8f8f97}

/* ---------- Layout breakpoints ---------- */
@media (min-width:900px){
  .landing{grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr)}
  .hero{min-height:560px;display:flex;flex-direction:column;justify-content:center;padding:44px 40px}
  #vAuth{position:sticky;top:90px}
  #vCust{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:start}
  #vCust>.card{margin-bottom:0}
  #vDrv{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  #vDrv>.card:first-child{grid-column:1/-1}
  #vAdm{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  #vAdm>.card{margin-bottom:0}
  #vAdm>#admMsg{grid-column:1/-1}
}
@media (max-width:899px){
  .hero{padding:28px 22px 24px}
  .hero-art{opacity:.45;width:70%}
}
@media (max-width:700px){
  .how{grid-template-columns:1fr}
  .cta-band{flex-direction:column;align-items:stretch;text-align:left}
  .cta-band .btn{width:100%}
}
@media (max-width:600px){
  header{gap:8px;padding-left:14px;padding-right:14px;min-height:64px}
  header h1{font-size:18px;gap:10px}
  header h1 small{font-size:10px;line-height:1.25}
  .logo{width:40px;height:40px;border-radius:12px}.logo svg{width:27px;height:27px}
  .hbtn{padding:8px 12px;font-size:12px}
  main{padding:14px 12px 6px}
  .card{padding:18px;border-radius:18px}
  #vAuth .card{padding:20px}#vAuth .card::before{margin:-20px -20px 18px}
  .map{height:270px}
  .home-map{height:48vh;min-height:300px}
  .booking-panel{margin:-26px 8px 0}
  .booking-panel .btn{width:100%}
  .stats{grid-template-columns:repeat(2,1fr)}
  .row{gap:6px}
  .hero-cta .btn,.hero-cta .ghost{width:100%;justify-content:center}
  .paypick button{font-size:12px}
  #toasts{top:72px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .toast,.pin-drv::after{animation:none}
  button{transition:none}
}

.service-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.service-option{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:15px;border:2px solid #e7e7e7;border-radius:16px;background:#fff;color:#151515;cursor:pointer;text-align:left;min-height:112px}
.service-option.on{border-color:#ff8a00;background:#fff6eb;box-shadow:0 0 0 2px rgba(255,138,0,.10)}
.service-icon{font-size:27px}.service-option small{color:#666;font-size:12px}
#vehicleClassWrap{margin:10px 0 16px}
@media(max-width:420px){.service-option{padding:12px;min-height:105px}}


textarea{width:100%;min-height:84px;padding:13px 15px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--field);color:var(--ink);font:inherit;resize:vertical}
textarea:focus{outline:none;background:#fff;border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,138,0,.16)}
.modal{position:fixed;inset:0;z-index:1000;background:rgba(10,10,12,.66);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 20px 26px;max-height:94vh;overflow:auto;box-shadow:0 -12px 40px rgba(0,0,0,.35)}
@media(min-width:600px){.modal{align-items:center}.modal .sheet{border-radius:24px}}
.modal h3{margin:0 0 6px;font-size:20px;font-weight:800;letter-spacing:-.2px}
.offer-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.offer-fare{font-size:34px;font-weight:900;color:var(--orange-deep);letter-spacing:-.5px;line-height:1.1}
.offer-route{margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--field);border:1px solid var(--line);font-size:15px}
.offer-route div+div{margin-top:8px}
.offer-route small{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.cdown{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.cdown i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--orange-2),var(--orange));transition:width .25s linear}
.btnrow{display:flex;gap:10px}.btnrow .btn{margin:0}
button.btn.ghost2{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.stars{display:flex;gap:4px;margin:6px 0 10px}
.stars button{font-size:36px;line-height:1;background:none;border:0;padding:2px 4px;cursor:pointer;filter:grayscale(1);opacity:.35}
.stars button.on{filter:none;opacity:1}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;background:#eee;color:#555}
.badge.top{background:#fff0bf;color:#7a5200}.badge.trusted{background:#dcf5e5;color:#13633a}.badge.watch{background:var(--err-bg);color:var(--err)}
.kv{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.kv span{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:13px}
.kv b{display:block;font-size:17px}
.pin{display:inline-block;letter-spacing:6px;font-size:26px;font-weight:900;background:var(--orange-soft);border:1px dashed var(--orange);border-radius:12px;padding:6px 14px;margin:6px 0}
.sub-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sub-actions a.btn,.sub-actions button.btn{width:auto;margin:0;min-height:40px;padding:8px 14px;font-size:13px;text-decoration:none}
</style>
</head>
<body>

</svg>

<header>
  <h1 class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 48 48" fill="#0e0e10"><path transform="translate(11.34 38.0) scale(0.04 -0.04)" d="M390 241Q390 283 377.0 302.0Q364 321 341.5 325.5Q319 330 292 329L266 328V164Q266 137 265.0 113.0Q264 89 262 76H396Q426 76 454.0 89.5Q482 103 500.0 134.5Q518 166 518 220H583L578 0H50V66Q73 67 88.5 72.0Q104 77 112.5 95.0Q121 113 121 153V536Q121 563 122.5 588.0Q124 613 125 626Q109 625 85.0 624.5Q61 624 50 623V700H550L556 506H490Q490 561 471.0 589.0Q452 617 424.0 626.5Q396 636 369 635L333 634Q312 634 297.0 628.5Q282 623 274.0 604.5Q266 586 266 547V397H383L379 484H456V241Z"/></svg></span><span class="word">E&amp;Bz <span class="brand-accent">Mobility</span><small data-i18n="tagline"></small></span></h1>
  <button id="langBtn" class="hbtn" type="button" aria-label="Language / Langue"><svg class="ic"><use href="#i-globe"/></svg><span id="langTxt">EN</span></button>

</header>
<div id="toasts" role="status" aria-live="polite"></div>
<main>
  <div class="landing">
    <section id="publicHero" class="hero">
      <svg class="hero-art" viewBox="0 0 440 260" fill="none" aria-hidden="true">

<div id="rateModal" class="modal hide" role="dialog" aria-modal="true" aria-labelledby="rateTitle">

/* Load map and database libraries with CDN fallbacks; the app starts once both attempts finish. */
(function () {
  function loadScript(url) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = url; s.onload = resolve;
      s.onerror = () => reject(new Error('Could not load ' + url));
      document.head.appendChild(s);
    });
  }
  async function loadWithFallback(primary, fallback) {
    try { await loadScript(primary); return true; }
    catch (e1) {
      try { await loadScript(fallback); return true; }
      catch (e2) { console.error(e1, e2); return false; }
    }
  }
  (async () => {
    const [leafletOK, supabaseOK] = await Promise.all([
      loadWithFallback('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js','https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js'),
      loadWithFallback('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://unpkg.com/@supabase/supabase-js@2')
    ]);
    window.KLANDO_DEPENDENCIES = { leafletOK, supabaseOK };
    document.dispatchEvent(new Event('klando-dependencies-ready'));
  })();
})();
</script>

/* Re-render a container without losing what the user is typing (the 10 s refresh used to wipe inputs). */
function keepInputs(container, render){
  const vals = {};
  container.querySelectorAll('input[id]').forEach(i => { vals[i.id] = i.value; });
  const act = document.activeElement;
  const actId = act && container.contains(act) ? act.id : null;
  const selStart = actId && act.selectionStart != null ? act.selectionStart : null;
  render();
  Object.keys(vals).forEach(id => { const el = document.getElementById(id); if (el && vals[id]) el.value = vals[id]; });
  if (actId) { const el = document.getElementById(actId); if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch(e){} } }
}

const dist = (a,b) => {
  const R=6371, r=x=>x*Math.PI/180, dLa=r(b[0]-a[0]), dLo=r(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
};

function fareConfig(){
  return {base:FARE.base,perKm:FARE.perKm,step:FARE.step,range:isNight()?FARE.night:FARE.day};
}
const calcFare = km => {
  if (selectedService === 'vehicle') return isNight() ? FARE.car.night : FARE.car.day;
  const f = fareConfig(), raw = Math.round((f.base + f.perKm*km*1.3)/f.step)*f.step;
  return Math.min(f.range.max, Math.max(f.range.min, raw));
};

async function start(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return show('vAuth');
  me.user = session.user;
  const md = me.user.user_metadata || {};
  const pr = await sb.from('profiles').select('*').eq('id', me.user.id).maybeSingle();
  me.profile = pr.data || null;
  let dr = await sb.from('drivers').select('*').eq('user_id', me.user.id).maybeSingle();
  me.driver = dr.data || null;
  if (!me.driver && md.want_driver && (!me.profile || me.profile.role !== 'admin')) {
    const ins = await sb.from('drivers').insert({
      user_id: me.user.id, display_name: md.display_name || me.user.email, phone: md.phone || null,
      vehicle: md.vehicle || null, vehicle_plate: md.vehicle_plate || null, service_type: md.service_type || 'moto',
      approval_status: 'pending', is_available: false }).select().maybeSingle();
    if (ins.error) flash('globalMsg', t('err') + ins.error.message); else me.driver = ins.data;
  }
  const pRole = me.profile && me.profile.role;
  me.role = pRole === 'admin' ? 'admin' : (me.driver || pRole === 'driver') ? 'driver' : 'customer';
  if (me.role === 'admin') { show('vAdm'); mkMap('mapA'); }
  else if (me.role === 'driver') show('vDrv');
  else { show('vCust'); initCustomer(); loadAccount(); }
  applyLang();
  scheduleRefresh();
}

/* Adaptive polling: every 4 s while a customer has a live ride, every 10 s otherwise. */
function scheduleRefresh(){

}
async function refresh(){
  if (!me.user || refreshing) return;
  refreshing = true;
  try {
    if (me.role === 'customer') { updateFare(); await loadCustomer(); } // updateFare also flips day/night rate on time
    else if (me.role === 'driver') await loadDriver();
    else if (me.role === 'admin') await loadAdmin();
  } catch(e){ console.error(e); }
  finally { refreshing = false; }
}

async function geocodeDestination(query){
  const q = query.trim();
  if (!q) return false;
  const lookupId = ++destinationLookup;
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=td&q='
      + encodeURIComponent(q + ", N'Djamena");
    const response = await fetch(url, { headers: { 'Accept-Language': lang } });
    if (!response.ok) throw new Error('Geocoding service unavailable');
    const results = await response.json();
    if (lookupId !== destinationLookup) return false; // a newer search superseded this one
    if (!results.length) {
      C.dest = null; C.destQuery = '';
      if (C.mk.d && maps.mapC) { maps.mapC.removeLayer(C.mk.d); C.mk.d = null; }
      updateFare(); flash('custMsg', t('noPos'), 'warn');
      return false;
    }
    C.dest = [parseFloat(results[0].lat), parseFloat(results[0].lon)];
    C.destQuery = q;
    placeMarker('d', C.dest);
    if (maps.mapC) maps.mapC.setView(C.dest, 14);
    flash('custMsg', '');
    return true;
  } catch(error) {
    if (lookupId === destinationLookup) { C.dest = null; C.destQuery = ''; updateFare(); flash('custMsg', t('noPos'), 'warn'); }
    return false;
  }
}
/* Single entry point: reuses a lookup already in flight, so blur + click never run two searches. */
function ensureDestination(q){
  if (C.dest && C.destQuery === q) return Promise.resolve(true);
  if (destPromise && destPromiseQ === q) return destPromise;
  destPromiseQ = q;
  const p = geocodeDestination(q).finally(() => { if (destPromise === p) destPromise = null; });
  destPromise = p;
  return p;
}

}

    if (!C.dest || C.destQuery !== dest) {
      const ok = await ensureDestination(dest);
      if (!ok || !C.dest || C.destQuery !== dest) return flash('custMsg', t('noPos'), 'warn');
    }
    const fare = calcFare(dist(C.pick, C.dest));
    const name = (me.profile && me.profile.display_name) || (me.user.user_metadata||{}).display_name || me.user.email;
    const { error } = await sb.from('rides').insert({
      customer_id: me.user.id, customer_name: name,
      pickup_address: $('cPick').value.trim() || t('mapPoint'),
      destination: dest,
      pickup_lat: C.pick[0], pickup_lng: C.pick[1],
      destination_lat: C.dest[0], destination_lng: C.dest[1],
      estimated_fare: fare, service_type:selectedService, ...deliveryPayload(), status: 'pending', payment_method: $('paymentMethod').value, payment_status: 'unpaid'
    });
    if (error) return flash('custMsg', t('err') + error.message);
    flash('custMsg', t('sent'), 'ok');
    $('cDest').value = ''; ['dRName','dRPhone','dNotes'].forEach(i => { $(i).value = ''; });
    $('paymentMethod').value = 'cash'; syncPay();
    if (C.mk.d && maps.mapC) { maps.mapC.removeLayer(C.mk.d); C.mk.d = null; }
    C.dest = null; C.destQuery = '';
    updateFare();
    loadCustomer();
  } finally { busy(btn, false); }
};

/* ============ NOTIFICATIONS ============ */
function beep(){
  try {
    const ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination); o.frequency.value = 880;
    g.gain.setValueAtTime(.001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.25, ac.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .5);
    o.start(); o.stop(ac.currentTime + .5);
  } catch(e){}
}
function requestNotifPermission(){
  try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch(e){}
}
/* In-app banner + sound + vibration; a system notification too when the tab is in the background. */
function notify(title, body, kind){
  const d = document.createElement('div');
  d.className = 'toast ' + (kind || '');
  d.innerHTML = `<b>${esc(title)}</b><span>${esc(body)}</span>`;
  d.onclick = () => d.remove();
  $('toasts').appendChild(d);
  setTimeout(() => d.remove(), 12000);
  beep();
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch(e){}
  try { if (document.hidden && 'Notification' in window && Notification.permission === 'granted') new Notification(title, { body }); } catch(e){}
}

/* ============ LIVE RIDE (customer) ============ */
const seen = {}, geoArrived = {};
const LIVE = { rideId:null, pick:null, dest:null, drv:null, fit:null, dismissed:{} };
const ARRIVE_KM = 0.1, MOTO_KMH = 25;
const eta = km => Math.max(1, Math.round(km / MOTO_KMH * 60));
const ll = (a, b) => [Number(a), Number(b)];
const hasPos = (a, b) => a != null && b != null && !isNaN(Number(a)) && !isNaN(Number(b));

function pickLive(rides){
  const act = rides.find(r => ['pending','accepted','ongoing'].includes(r.status));
  if (act) return act;
  return rides.find(r => r.status === 'completed' && !LIVE.dismissed[r.id] && Date.now() - new Date(r.created_at) < 12*3600*1000) || null;
}
async function fetchDriver(r){
  let res = await sb.rpc('get_klando_ride_driver', { p_ride_id: r.id });
  const d = Array.isArray(res.data) ? res.data[0] : res.data;
  if (!res.error && d) return d;
  if (r.driver_id) {   // fallback when the database function is not installed
    const q = await sb.from('drivers').select('display_name,phone,vehicle,vehicle_plate,latitude,longitude').or(`id.eq.${r.driver_id},user_id.eq.${r.driver_id}`).maybeSingle();
    if (q.data) return q.data;
  }
  return null;
}
/* Compare each ride with what we saw last time and alert on changes (the first load only sets the baseline). */
function checkEvents(r){
  const prev = seen[r.id], cur = { status:r.status, arrived:!!r.arrived_at, pay:r.payment_status };
  if (prev) {
    if (prev.status !== cur.status) {
      if (prev.status === 'accepted' && cur.status === 'pending') notify(t('nRequeueT'), t('nRequeueB'), 'warn');
      else if (cur.status === 'accepted') notify(t('nAcceptedT'), t('nAcceptedB'));
      else if (cur.status === 'ongoing') notify(t('nOngoingT'), t('nOngoingB'));
      else if (cur.status === 'completed') notify(t('nDoneT'), t('nDoneB').replace('{amount}', money(finalFare(r))).replace('{method}', payLabel(r.payment_method)), 'ok');
      else if (cur.status === 'cancelled') notify(t('nCancelT'), t('nCancelB'), 'warn');
    }
    if (!prev.arrived && cur.arrived && r.status === 'accepted' && !geoArrived[r.id]) notify(t('nArrivedT'), t('nArrivedB'));
    if (prev.pay !== cur.pay && cur.pay === 'paid') notify(t('nPaidT'), t('nPaidB'), 'ok');
  }
  seen[r.id] = cur;
}
async function updateLive(rides){
  try {
    const live = pickLive(rides);
    liveRideId = live ? live.id : null;
    liveActive = !!live && ['pending','accepted','ongoing'].includes(live.status);
    let driver = null;
    if (live && ['accepted','ongoing','completed'].includes(live.status)) {
      driver = await fetchDriver(live);
      if (driver && live.driver_id) {
        const ri = await sb.rpc('ebz_ride_driver_info', { p_ride_id: String(live.id) });
        if (!ri.error && ri.data) driver = Object.assign({}, driver, { _info: ri.data });
      }
      // Automatic arrival alert when the driver is within 100 m of the pickup point.
      if (driver && live.status === 'accepted' && !live.arrived_at && !geoArrived[live.id]
          && hasPos(driver.latitude, driver.longitude) && hasPos(live.pickup_lat, live.pickup_lng)
          && dist(ll(driver.latitude, driver.longitude), ll(live.pickup_lat, live.pickup_lng)) < ARRIVE_KM) {
        geoArrived[live.id] = true;
        if (seen[live.id]) notify(t('nArrivedT'), t('nArrivedB'));
      }
    }
    rides.forEach(checkEvents);
    renderLive(live, driver);
  } catch(e){ console.error(e); }
}
function updateLiveMap(m, r, dpos){
  if (LIVE.rideId !== r.id) {
    ['pick','dest','drv'].forEach(k => { if (LIVE[k]) { m.removeLayer(LIVE[k]); LIVE[k] = null; } });
    LIVE.rideId = r.id; LIVE.fit = null;
    if (hasPos(r.pickup_lat, r.pickup_lng)) LIVE.pick = L.marker(ll(r.pickup_lat, r.pickup_lng), { icon:dIcon('pick') }).addTo(m).bindPopup(esc(t('pickup')));
    if (hasPos(r.destination_lat, r.destination_lng)) LIVE.dest = L.marker(ll(r.destination_lat, r.destination_lng), { icon:dIcon('dest') }).addTo(m).bindPopup(esc(t('destination')));
  }
  if (dpos) { if (!LIVE.drv) LIVE.drv = L.marker(dpos, { icon:dIcon('drv'), zIndexOffset:1000 }).addTo(m); else LIVE.drv.setLatLng(dpos); }
  else if (LIVE.drv) { m.removeLayer(LIVE.drv); LIVE.drv = null; }
  const pts = [];
  if (hasPos(r.pickup_lat, r.pickup_lng)) pts.push(ll(r.pickup_lat, r.pickup_lng));
  if (hasPos(r.destination_lat, r.destination_lng)) pts.push(ll(r.destination_lat, r.destination_lng));
  if (dpos) pts.push(dpos);
  const key = dpos ? 'with-driver' : 'no-driver';   // re-fit once when the driver first appears, then leave the view alone
  if (pts.length && LIVE.fit !== key) { m.fitBounds(pts, { padding:[40,40], maxZoom:16 }); LIVE.fit = key; }
}
function payBlock(r){
  const id = esc(r.id), amt = money(finalFare(r)), mobile = !!PAY[r.payment_method];
  let h = '';
  if (r.payment_status === 'paid') h = `<div class="msg ok">${ic('check')} ${esc(t('payPaid').replace('{amount}', amt))}</div>`;
  else if (mobile && ['unpaid','failed'].includes(r.payment_status)) h = `<div class="msg warn">${transferText(r)}</div><label for="lref-${id}">${t('referenceLabel')}</label><input id="lref-${id}" maxlength="100" placeholder="${esc(t('referencePlaceholder'))}"><button class="btn alt sm" data-live-pay="${id}">${t('sendReference')}</button>`;
  else if (mobile && r.payment_status === 'awaiting_verification') h = `<div class="msg warn">${t('payAwaiting')}</div>`;
  else if (!mobile && r.status === 'completed') h = `<div class="msg warn">${esc(t('payCash').replace('{amount}', amt))}</div>`;
  else if (!mobile) h = `<div class="muted">${t('payment')}: ${t('cash')}</div>`;
  if (r.status === 'completed') h += `<button class="btn alt sm" data-live-close="${id}">${t('close')}</button>`;
  return h;
}
function renderLive(r, d){
  const card = $('liveCard');
  if (!r) { card.classList.add('hide'); return; }
  const wasHidden = card.classList.contains('hide');
  card.classList.remove('hide');
  const arrived = !!r.arrived_at || !!geoArrived[r.id];
  const idx = r.status === 'pending' ? 0 : r.status === 'accepted' ? (arrived ? 2 : 1) : r.status === 'ongoing' ? 3 : 4;
  $('liveSteps').innerHTML = ['stReq','stRoute','stArrived', r.kind === 'delivery' ? 'stRideD' : 'stRide','stDone'].map((k,i) =>
    `<div class="step ${i < idx ? 'done' : i === idx ? 'cur' : ''}"><i>${i < idx ? ic('check') : i + 1}</i><span>${t(k)}</span></div>`).join('');
  $('livePill').innerHTML = pill(r.status);

  const dpos = d && hasPos(d.latitude, d.longitude) && r.status !== 'completed' ? ll(d.latitude, d.longitude) : null;
  let line;
  if (r.status === 'pending') line = t(r.dispatch_state === 'no_driver' ? 'liveNoDriver' : r.dispatch_state === 'offering' ? 'liveOffering' : r.dispatch_state === 'searching' ? 'liveSearching' : 'liveWaiting');
  else if (r.status === 'accepted') {
    if (arrived) line = t('liveArrived');
    else if (dpos && hasPos(r.pickup_lat, r.pickup_lng)) { const km = dist(dpos, ll(r.pickup_lat, r.pickup_lng)); line = t('liveComing').replace('{min}', eta(km)).replace('{km}', km.toFixed(1)); }
    else line = t('liveComingNoPos');
  } else if (r.status === 'ongoing') {
    if (dpos && hasPos(r.destination_lat, r.destination_lng)) { const km = dist(dpos, ll(r.destination_lat, r.destination_lng)); line = t('liveOngoing').replace('{min}', eta(km)).replace('{km}', km.toFixed(1)); }
    else line = t('liveOngoingNoPos');
  } else line = t('liveDone');

  let who = '';
  if (d && d.display_name) {
    const tel = String(d.phone || '').replace(/[^0-9+]/g, '');
    who = `<div class="drv"><span class="av">${esc(String(d.display_name).trim().charAt(0).toUpperCase())}</span><div><b>${esc(d.display_name)}</b><div class="muted">${esc(d.vehicle || '')} ${esc(d.vehicle_plate || '')}</div></div></div>` + (tel ? `<a class="call" href="tel:${esc(tel)}">${ic('call')}${t('call')}</a>` : '');
  }
  if (who && d && d._info) who += `<div class="muted" style="margin:2px 0 6px">${ratingLine(d._info)}</div>`;
  $('liveInfo').innerHTML = `<div class="live-line">${esc(line)}</div>${who}
    <div class="sw" style="margin-top:8px"><span>${t(r.status === 'completed' ? 'finalFare' : 'liveFare')}</span><span class="fare">${money(finalFare(r))}</span></div>`;

  renderLiveExtra(r, d);
  const m = mkMap('mapLive');
  if (m) { if (wasHidden) setTimeout(() => m.invalidateSize(), 200); updateLiveMap(m, r, dpos); }

  keepInputs($('livePay'), () => { $('livePay').innerHTML = payBlock(r); });
  document.querySelectorAll('[data-live-pay]').forEach(b => b.onclick = async () => {
    const id = b.dataset.livePay, ref = ($(`lref-${id}`).value || '').trim();
    if (!ref) return flash('liveMsg', t('enterReference'), 'warn');
    b.disabled = true;
    const { error } = await submitPayment(id, ref);
    if (error) { b.disabled = false; flash('liveMsg', t('err') + error.message); }
    else { flash('liveMsg', t('referenceSent'), 'ok'); loadCustomer(); }
  });
  document.querySelectorAll('[data-live-close]').forEach(b => b.onclick = () => { LIVE.dismissed[b.dataset.liveClose] = true; flash('liveMsg', ''); loadCustomer(); });
}

function renderAvail(){

$('availBtn').onclick = async () => {

    me.driver.is_available = next; renderAvail(); manageGps(); managePoll(); loadDriver();
  } finally { busy(btn, false); }

function manageGps(){
  // Keep sending the position during an accepted/ongoing ride, even if the driver is no longer "available".
  const need = me.driver && me.driver.approval_status === 'approved' && (me.driver.is_available || drvActive);
  if (need && gpsWatch == null && navigator.geolocation) {
    gpsWatch = navigator.geolocation.watchPosition(p => { lastPos = [p.coords.latitude, p.coords.longitude]; },
      () => flash('drvMsg', t('gpsDenied'), 'warn'), { enableHighAccuracy:true, maximumAge:10000 });
    gpsPushTimer = setInterval(pushGps, GPS_PUSH_MS); setTimeout(pushGps, 3000);
  } else if (!need) {
    if (gpsWatch != null && navigator.geolocation) navigator.geolocation.clearWatch(gpsWatch);
    gpsWatch = null; clearInterval(gpsPushTimer); gpsPushTimer = null;
  }
}
async function pushGps(){
  if (!lastPos) return;
  const { error } = await sb.rpc('update_klando_driver_location', { p_lat:lastPos[0], p_lng:lastPos[1] });
  if (error && !gpsFnWarned) { gpsFnWarned = true; console.warn(error); flash('drvMsg', t('gpsNoFn'), 'warn'); }
}
async function loadDriver(){
  const dr = await sb.from('drivers').select('*').eq('user_id', me.user.id).maybeSingle();
  if (dr.data) me.driver = dr.data;

    <div class="msg ${st==='approved'?'ok':st==='rejected'?'err':'warn'}">${t(st==='approved'?'drvApproved':st==='rejected'?'drvRejected':'drvPending')}</div>`;
  $('drvSwitch').classList.toggle('hide', st !== 'approved'); renderAvail(); manageGps();
  if (st !== 'approved') { $('drvMine').innerHTML = $('drvPending').innerHTML = `<p class="muted">${t('noReq')}</p>`; return; }
  const mine = await sb.from('rides').select('*').or(`driver_id.eq.${d.id},driver_id.eq.${me.user.id}`).order('created_at',{ascending:false}).limit(20);
  drvActive = (mine.data||[]).some(r => ['accepted','ongoing'].includes(r.status));

    let a = '';
    const isD = r.kind === 'delivery';

    if (r.status==='accepted') {

      a += isD ? `<button class="btn sm" data-pickup="${esc(r.id)}">${t('iPickedUp')}</button>` : `<button class="btn sm" data-adv="${esc(r.id)}|ongoing">${t('start')}</button>`;
      if (!dispatchMissing) a += `<button class="btn red sm" data-cancel-open="${esc(r.id)}|driver">${t('cancel')}</button>`;
    }
    if (r.status==='ongoing') a += isD ? `<button class="btn sm" data-deliver="${esc(r.id)}">${t('iDelivered')}</button>` : `<button class="btn sm" data-adv="${esc(r.id)}|completed">${t('finish')}</button>`;
    if (r.status==='completed' && !PAY[r.payment_method] && r.payment_status !== 'paid') a = `<button class="btn sm" data-cash="${esc(r.id)}">${ic('cash')}${t('iCash')}</button>`;
    return rideHtml(r, a);
  }).join('') || `<p class="muted">${t('noRides')}</p>`;
  // Oldest request first, so the customer who has waited longest is served first.
  if (dispatchMissing) {   // database update not installed yet: old open list

    $('drvPending').innerHTML = d.is_available
      ? ((pend.data||[]).map(r => rideHtml(r, `<button class="btn sm" data-acc="${esc(r.id)}">${t('accept')}</button>`)).join('') || `<p class="muted">${t('noReq')}</p>`)
      : `<p class="muted">${t('goOn')}</p>`;
  } else {

  }
  loadDriverStats(); managePoll();
  document.querySelectorAll('[data-arrived]').forEach(b => b.onclick = async () => {
    b.disabled = true;

    if (error) { b.disabled = false; const miss = isMissingFn(error); flash('drvMsg', miss ? t('arrivedNoFn') : t('err') + error.message, miss ? 'warn' : 'err'); }

  document.querySelectorAll('[data-acc]').forEach(b => b.onclick = async () => {

  });
  document.querySelectorAll('[data-adv]').forEach(b => b.onclick = async () => {

    if (error) { b.disabled = false; flash('drvMsg', t('err') + error.message); } else { flash('drvMsg',''); loadDriver(); }
  });
}

/* ============ ADMIN ============ */
let admMk = [];
async function loadAdmin(){
  const [d, r, c] = await Promise.all([
    sb.from('drivers').select('*').order('created_at',{ascending:false}).limit(500),
    sb.from('rides').select('*').order('created_at',{ascending:false}).limit(500),
    sb.from('profiles').select('id',{count:'exact',head:true}).eq('role','customer')]);
  if (d.error || r.error) return flash('admMsg', t('err') + (d.error||r.error).message);
  const drivers = d.data||[], rides = r.data||[];
  const [mx, cx] = await Promise.all([sb.rpc('ebz_admin_driver_metrics'), sb.rpc('ebz_admin_complaints')]);
  const MX = {}; (mx.data||[]).forEach(m => { MX[String(m.driver_id)] = m; });
  renderComplaints(cx.error ? null : (cx.data||[]));
  const stat = (n,l) => `<div class="stat"><b>${n}</b><span>${t(l)}</span></div>`;
  $('admStats').innerHTML = stat(c.count ?? '—','sCustomers') + stat(drivers.filter(x=>x.approval_status==='approved').length,'sDrivers') +
    stat(drivers.filter(x=>x.is_available && x.approval_status==='approved').length,'sActive') + stat(rides.length,'sRides') +
    stat(rides.filter(x=>x.status==='completed').length,'sDone') + stat(drivers.filter(x=>x.approval_status==='pending').length,'sPend');
  $('admDrivers').innerHTML = drivers.map(x => `<div class="item"><div class="top"><b>${esc(x.display_name)}</b>${pill(x.approval_status)}</div>
    <div class="muted">${esc(x.phone||'')} · ${x.service_type==='vehicle'?'🚗 '+t('serviceVehicle'):'🏍️ '+t('serviceMoto')} · ${esc(x.vehicle||'')} ${esc(x.vehicle_plate||'')} · ${x.is_available?t('on'):t('off')}</div>${scoreHtml(MX[String(x.id)])}
    ${x.approval_status!=='approved' ? `<button class="btn sm" data-ap="${esc(x.id)}|approved">${t('approve')}</button>` : ''}${x.approval_status!=='rejected' ? `<button class="btn red sm" data-ap="${esc(x.id)}|rejected">${t('reject')}</button>` : ''}</div>`).join('') || `<p class="muted">${t('noDrivers')}</p>`;
  $('admRides').innerHTML = rides.slice(0,40).map(x => rideHtml(x)).join('') || `<p class="muted">${t('noRides')}</p>`;
  const awaiting = rides.filter(x => PAY[x.payment_method] && x.payment_status==='awaiting_verification');
  $('admPayments').innerHTML = awaiting.map(x => `<div class="item"><b>${esc(x.customer_name || t('clientName'))}</b><div>${esc(x.pickup_address)} → ${esc(x.destination)}</div><div class="muted">${esc(payLabel(x.payment_method))} · ${t('amount')}: ${money(finalFare(x))} · ${t('reference')}: ${esc(x.payment_reference || '—')}</div><button class="btn sm" data-verify-payment="${esc(x.id)}">${t('confirmPayment')}</button></div>`).join('') || `<p class="muted">${t('noPayment')}</p>`;
  document.querySelectorAll('[data-verify-payment]').forEach(b => b.onclick = async () => {
    if (!confirm(t('confirmReceived'))) return;
    b.disabled=true;
    const { error } = await verifyPayment(b.dataset.verifyPayment);
    if (error) { b.disabled=false; flash('admMsg',t('err')+error.message); }
    else { flash('admMsg',t('paymentConfirmed'),'ok'); loadAdmin(); }
  });
  document.querySelectorAll('[data-ap]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const [id, s] = b.dataset.ap.split('|');
    const { error } = await sb.from('drivers').update({ approval_status: s }).eq('id', id);
    if (error) { b.disabled = false; flash('admMsg', t('err') + error.message); } else { flash('admMsg',''); loadAdmin(); }
  });
  const m = mkMap('mapA');
  if (!m) return;
  admMk.forEach(x => m.removeLayer(x)); admMk = [];
  drivers.filter(x => x.is_available && x.approval_status==='approved' && x.latitude != null && x.longitude != null)
    .forEach(x => admMk.push(L.marker([x.latitude, x.longitude], { icon:dIcon('drv') }).addTo(m).bindPopup(esc(x.display_name))));
}

/* ============ E&Bz EXTENSIONS: dispatch offers, cancellations, ratings, badges, delivery ============ */

Object.assign(I18N.en, { starsNeed:'Choose a rating from 1 to 5 stars.' });
var kind = 'ride', ACCT = null, acctDefaulted = false, REVIEWED = new Set(), REVIEW_READY = false, PINS = {};
var pollTimer = null, polling = false, dispatchMissing = false, drvBusy = false;
var offerRide = null, offerExpiry = 0, offerTick = null, ringTimer = null;
var POLL_MS = 3000, OFFER_TOTAL_MS = 20000;
const CUSTOMER_CANCEL = ['changed_mind','wait_too_long','wrong_address','other_transport','price','driver_asked','other'];
const DRIVER_CANCEL = ['customer_no_show','customer_asked','wrong_address','too_far','vehicle_issue','unsafe','other'];
const ACCOUNT_TYPES = ['rider','restaurant','shop','business','other'];
const ITEM_TYPES = ['food','parcel','documents','groceries','other'];

const reasonLabel = (code, by) => t((by === 'driver' ? 'dr_' : 'cr_') + code);
const itemLabel = c => c ? t('item_' + c) : '';
function fillSelect(id, codes, prefix){
  const el = $(id); if (!el) return;
  const cur = el.value;
  el.innerHTML = codes.map(c => `<option value="${c}">${esc(t(prefix + c))}</option>`).join('');
  if (cur && codes.includes(cur)) el.value = cur;
}
function buildLists(){
  fillSelect('rAcct', ACCOUNT_TYPES, 'acct_'); fillSelect('acctType', ACCOUNT_TYPES, 'acct_');
  fillSelect('dItem', ITEM_TYPES, 'item_'); fillSelect('dSize', SIZES, 'size_'); fillSelect('rateCat', COMPLAINT_CATS, 'cc_');
}
const badgeHtml = b => `<span class="badge ${esc(b || 'new')}">${esc(t('badge_' + (b || 'new')))}</span>`;
const pct = x => Math.round(Number(x || 0) * 100);
function ratingLine(i){
  const r = i.rating_count > 0 ? '⭐ ' + t('ratingLine').replace('{avg}', Number(i.rating_avg).toFixed(1)).replace('{n}', i.rating_count) : t('ratingNone');
  return `${r} · ${badgeHtml(i.badge)}`;
}
function scoreHtml(m){
  if (!m) return '';
  const line = t('scoreLine').replace('{avg}', m.rating_avg != null ? Number(m.rating_avg).toFixed(1) : '—').replace('{done}', m.completed)
    .replace('{cr}', pct(m.cancel_rate)).replace('{ar}', m.acceptance_rate != null ? pct(m.acceptance_rate) : '—');
  return `<div class="muted" style="margin-top:4px">${badgeHtml(m.badge)} ${esc(line)}</div>`;
}

/* ---- customer account type (rider, restaurant, shop, business) ---- */
async function loadAccount(){
  const md = me.user.user_metadata || {};
  let r = await sb.from('ebz_business_accounts').select('*').eq('user_id', me.user.id).maybeSingle();
  if (r.error) return;   // database update not installed yet
  if (!r.data && md.account_type) {
    const up = await sb.from('ebz_business_accounts').upsert({ user_id: me.user.id, account_type: md.account_type, business_name: md.business_name || null, phone: md.phone || null });
    if (!up.error) r = await sb.from('ebz_business_accounts').select('*').eq('user_id', me.user.id).maybeSingle();
  }
  ACCT = r.data || null;
  if (ACCT) { $('acctType').value = ACCT.account_type; $('acctBiz').value = ACCT.business_name || ''; }
  $('acctBizWrap').classList.toggle('hide', $('acctType').value === 'rider');
  if (!acctDefaulted && ACCT && ['restaurant','shop','business'].includes(ACCT.account_type)) { acctDefaulted = true; setKind('delivery'); }
}
$('acctType').onchange = () => $('acctBizWrap').classList.toggle('hide', $('acctType').value === 'rider');
$('acctSave').onclick = async () => {
  const md = me.user.user_metadata || {};
  const row = { user_id: me.user.id, account_type: $('acctType').value, business_name: $('acctBiz').value.trim() || null, phone: md.phone || null };
  const { error } = await sb.from('ebz_business_accounts').upsert(row);
  if (error) return flash('acctMsg', t('err') + error.message);
  ACCT = row; flash('acctMsg', t('saved'), 'ok');
  if (row.account_type !== 'rider') setKind('delivery');
};

function deliveryInfo(r){

async function loadReviewed(rides){
  const ids = rides.filter(r => r.status === 'completed').map(r => String(r.id));
  const rv = ids.length ? await sb.from('ride_reviews').select('ride_id').in('ride_id', ids) : { data: [], error: null };
  if (rv.error) { REVIEW_READY = false; return; }
  REVIEW_READY = true;
  (rv.data || []).forEach(x => REVIEWED.add(String(x.ride_id)));
}

/* ---- live card extras: delivery code, share, cancel, rate, help ---- */
function renderLiveExtra(r, d){
  const box = $('liveExtra'); if (!box) return;
  let h = '', acts = '';
  if (r.kind === 'delivery' && ['pending','accepted','ongoing'].includes(r.status)) {
    if (PINS[r.id] === undefined) {
      PINS[r.id] = null;
      sb.from('ebz_delivery_secrets').select('pin').eq('ride_id', String(r.id)).maybeSingle()
        .then(x => { if (x.data) { PINS[r.id] = x.data.pin; renderLiveExtra(r, d); } }, () => {});
    }
    if (PINS[r.id]) {
      const phone = String(r.recipient_phone || '').replace(/\D/g, '');
      const txt = encodeURIComponent(t('codeText').replace('{pin}', PINS[r.id]));
      h += `<div class="msg warn"><b>${t('delivCode')}</b><br><span class="pin">${esc(PINS[r.id])}</span><div class="muted">${t('delivCodeHelp')}</div>` +
           `<div class="sub-actions"><a class="call" target="_blank" rel="noopener" href="https://wa.me/${phone}?text=${txt}">${t('sendCodeWa')}</a></div></div>`;
    }
  }
  if (['accepted','ongoing'].includes(r.status) && d && d.display_name && r.kind !== 'delivery') {
    const txt = encodeURIComponent(t('shareText').replace('{name}', d.display_name).replace('{vehicle}', d.vehicle || '').replace('{plate}', d.vehicle_plate || '').replace('{dest}', r.destination || ''));
    acts += `<a class="call" target="_blank" rel="noopener" href="https://wa.me/?text=${txt}">${t('shareTrip')}</a>`;
  }
  if (['pending','accepted'].includes(r.status)) acts += `<button class="btn red sm" type="button" data-cancel-open="${esc(r.id)}|customer" style="margin:6px 8px 6px 0">${t('cancel')}</button>`;
  if (r.status === 'completed' && REVIEW_READY && !REVIEWED.has(String(r.id))) acts += `<button class="btn sm" type="button" data-rate="${esc(r.id)}" style="margin:6px 8px 6px 0">${t('rateBtn')}</button>`;
  if (SUPPORT.whatsapp && r.status !== 'completed') acts += `<a class="call" target="_blank" rel="noopener" href="https://wa.me/${esc(String(SUPPORT.whatsapp).replace(/\D/g, ''))}">${t('helpBtn')}</a>`;
  box.innerHTML = h + (acts ? `<div class="sub-actions">${acts}</div>` : '');
}

/* ---- pop-ups (kept outside the refreshed lists so nothing is lost while typing) ---- */
document.addEventListener('click', e => {
  const c = e.target.closest('[data-cancel-open]');
  if (c) { const [id, who] = c.dataset.cancelOpen.split('|'); return openCancel(id, who); }
  const r = e.target.closest('[data-rate]'); if (r) return openRate(r.dataset.rate);
  const dl = e.target.closest('[data-deliver]'); if (dl) return openPin(dl.dataset.deliver);
  const pk = e.target.closest('[data-pickup]'); if (pk) return doPickup(pk);
});

var CANCEL = { id:null, who:null };
function openCancel(id, who){
  CANCEL = { id, who };
  const codes = who === 'driver' ? DRIVER_CANCEL : CUSTOMER_CANCEL;
  $('cancelReason').innerHTML = `<option value="">—</option>` + codes.map(c => `<option value="${c}">${esc(reasonLabel(c, who))}</option>`).join('');
  $('cancelNote').value = ''; $('cancelMsg').innerHTML = '';
  $('cancelHelp').textContent = t(who === 'driver' ? 'cancelHelpD' : 'cancelHelpC');
  $('cancelModal').classList.remove('hide');
}
$('cancelClose').onclick = () => $('cancelModal').classList.add('hide');
$('cancelConfirm').onclick = async () => {
  const reason = $('cancelReason').value;
  if (!reason) return flash('cancelMsg', t('cancelChoose'), 'warn');
  const btn = $('cancelConfirm'); busy(btn, true);
  try {
    const { data, error } = await sb.rpc('ebz_cancel_ride', { p_ride_id: String(CANCEL.id), p_reason: reason, p_note: $('cancelNote').value.trim() || null });
    if (error) return flash('cancelMsg', t('err') + error.message);
    $('cancelModal').classList.add('hide');
    if (CANCEL.who === 'driver') { flash('drvMsg', t(data === 'requeued' ? 'cancelRequeued' : 'cancelDone'), 'ok'); loadDriver(); }
    else { flash('custMsg', t('cancelDone'), 'ok'); loadCustomer(); }
  } finally { busy(btn, false); }
};

var RATE = { id:null, stars:0 };
function renderStars(){
  $('rateStars').innerHTML = [1,2,3,4,5].map(n => `<button type="button" role="radio" aria-checked="${RATE.stars === n}" data-star="${n}" class="${n <= RATE.stars ? 'on' : ''}" aria-label="${n}">⭐</button>`).join('');
}
function openRate(id){
  RATE = { id, stars:0 }; renderStars();
  $('rateComment').value = ''; $('rateComplaint').checked = false; $('rateCatWrap').classList.add('hide'); $('rateMsg').innerHTML = '';
  $('rateModal').classList.remove('hide');
}
$('rateStars').addEventListener('click', e => { const b = e.target.closest('[data-star]'); if (!b) return; RATE.stars = +b.dataset.star; renderStars(); });
$('rateComplaint').onchange = () => $('rateCatWrap').classList.toggle('hide', !$('rateComplaint').checked);
$('rateClose').onclick = () => $('rateModal').classList.add('hide');
$('rateSend').onclick = async () => {
  if (!RATE.stars) return flash('rateMsg', t('starsNeed'), 'warn');
  const complaint = $('rateComplaint').checked, btn = $('rateSend'); busy(btn, true);
  try {
    const { error } = await sb.rpc('ebz_submit_review', { p_ride_id: String(RATE.id), p_rating: RATE.stars,
      p_comment: $('rateComment').value.trim() || null, p_complaint: complaint, p_category: complaint ? $('rateCat').value : null });

};

var PIN_RIDE = null;
function openPin(id){ PIN_RIDE = id; $('pinInput').value = ''; $('pinMsg').innerHTML = ''; $('pinModal').classList.remove('hide'); setTimeout(() => $('pinInput').focus(), 100); }
$('pinClose').onclick = () => $('pinModal').classList.add('hide');
$('pinConfirm').onclick = async () => {

async function doPickup(b){
  b.disabled = true;
  const { error } = await sb.rpc('ebz_driver_picked_up', { p_ride_id: String(b.dataset.pickup) });
  if (error) { b.disabled = false; flash('drvMsg', t('err') + error.message); } else { flash('drvMsg', ''); loadDriver(); }

/* ---- driver: incoming request pop-up (nearest driver first, 20 s to answer) ---- */
function showOffer(o){
  offerExpiry = Date.now() + (Number(o.seconds_left) || 0) * 1000;
  if (offerRide === o.ride_id) return;
  offerRide = o.ride_id;
  $('offerKind').textContent = o.kind === 'delivery' ? '📦 ' + t('kindDelivery') : (o.service_type === 'vehicle' ? '🚗 ' + t('serviceVehicle') : '🏍️ ' + t('serviceMoto'));
  $('offerFare').textContent = money(o.fare);
  const km = o.distance_km != null ? t('offerKmAway').replace('{km}', Number(o.distance_km).toFixed(1)) : '';
  $('offerSub').textContent = [km, o.kind === 'delivery' ? itemLabel(o.item_type) : '', payLabel(o.payment_method)].filter(Boolean).join(' · ');
  $('offerPick').textContent = o.pickup_address || '—'; $('offerDest').textContent = o.destination || '—';
  $('offerMsg').innerHTML = ''; $('offerAccept').disabled = false; $('offerDecline').disabled = false;
  $('offerModal').classList.remove('hide');
  notify(t('newRequest'), money(o.fare) + ' · ' + (o.destination || ''));
  clearInterval(ringTimer); ringTimer = setInterval(() => { beep(); try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch(e){} }, 2500);
  clearInterval(offerTick);
  offerTick = setInterval(() => {
    const left = offerExpiry - Date.now();
    $('offerBar').style.width = Math.max(0, Math.min(100, left / OFFER_TOTAL_MS * 100)) + '%';
    if (left <= -1500) hideOffer();
  }, 250);
}
function hideOffer(){
  offerRide = null; clearInterval(offerTick); clearInterval(ringTimer); offerTick = null; ringTimer = null;
  const m = $('offerModal'); if (m) m.classList.add('hide');
}
$('offerAccept').onclick = async () => {
  const id = offerRide; if (!id) return;
  $('offerAccept').disabled = true; $('offerDecline').disabled = true;
  const { error } = await sb.rpc('ebz_accept_offer', { p_ride_id: String(id) });
  if (error) { flash('offerMsg', t('offerExpired')); setTimeout(hideOffer, 2200); return; }
  hideOffer(); flash('drvMsg', ''); loadDriver();
};
$('offerDecline').onclick = async () => {
  const id = offerRide; hideOffer();
  if (id) await sb.rpc('ebz_decline_offer', { p_ride_id: String(id) });
};
function managePoll(){
  const d = me.driver, need = me.role === 'driver' && d && d.approval_status === 'approved' && d.is_available && !dispatchMissing;
  if (need) { if (!pollTimer && !polling) pollTimer = setTimeout(pollOnce, 200); }
  else { clearTimeout(pollTimer); pollTimer = null; hideOffer(); }
}
async function pollOnce(){
  pollTimer = null;
  if (polling || !me.user || me.role !== 'driver') return;
  polling = true;
  try {
    const { data, error } = await sb.rpc('ebz_driver_poll');
    if (error) { if (isMissingFn(error)) { dispatchMissing = true; loadDriver(); } }
    else { drvBusy = !!(data && data.busy); if (data && data.offer) showOffer(data.offer); else hideOffer(); }
  } catch(e){ console.warn(e); }
  finally { polling = false; }
  const d = me.driver;
  if (me.role === 'driver' && d && d.approval_status === 'approved' && d.is_available && !dispatchMissing) pollTimer = setTimeout(pollOnce, POLL_MS);
}
async function loadDriverStats(){
  const box = $('drvStats'); if (!box) return;
  const r = await sb.rpc('ebz_my_driver_stats');
  if (r.error || !r.data) { $('drvStatsCard').classList.add('hide'); if (r.error && isMissingFn(r.error)) dispatchMissing = true; return; }
  const x = r.data; $('drvStatsCard').classList.remove('hide');
  box.innerHTML = `<div>${badgeHtml(x.badge)}</div>
    <div class="kv">
      <span>${t('statRating')}<b>${x.rating_count > 0 ? '⭐ ' + Number(x.rating_avg).toFixed(1) : '—'}</b></span>
      <span>${t('statDone')}<b>${x.completed}</b></span>
      <span>${t('statCancel')}<b>${pct(x.cancel_rate)}%</b></span>
      <span>${t('statAccept')}<b>${x.acceptance_rate != null ? pct(x.acceptance_rate) + '%' : '—'}</b></span>
    </div>
    <div class="kv">
      <span>${t('todayRides')}<b>${x.today_rides}</b></span>
      <span>${t('todayGross')}<b>${money(x.today_gross)}</b></span>
      <span>${t('todayComm')}<b>${money(x.today_commission)}</b></span>
      <span>${t('todayNet')}<b>${money(x.today_net)}</b></span>
    </div>
    <p class="muted">${t('perfTip')}</p>`;
}

/* ---- admin: complaints ---- */
function renderComplaints(list){
  const box = $('admComplaints'); if (!box) return;
  if (list === null) { box.innerHTML = ''; return; }
  box.innerHTML = list.map(c => `<div class="item"><div class="top"><b>${'⭐'.repeat(c.rating)} · ${esc(t('cc_' + (c.category || 'other')))}</b><span class="pill ${c.status === 'open' ? 'pending' : 'completed'}">${esc(c.status === 'open' ? t('pending') : t('completed'))}</span></div>
    <div class="muted">${esc(c.customer_name || '')} → ${esc(c.driver_name || '')} · ${new Date(c.created_at).toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-GB')}</div>
    ${c.comment ? `<div>${esc(c.comment)}</div>` : ''}${c.admin_note ? `<div class="muted">${esc(c.admin_note)}</div>` : ''}
    ${c.status === 'open' ? `<button class="btn sm" data-resolve="${esc(c.id)}">${t('resolve')}</button>` : ''}</div>`).join('') || `<p class="muted">${t('noComplaints')}</p>`;
  box.querySelectorAll('[data-resolve]').forEach(b => b.onclick = async () => {
    const note = prompt(t('resolveNote'), ''); if (note === null) return;
    b.disabled = true;
    const { error } = await sb.rpc('ebz_admin_resolve_complaint', { p_id: Number(b.dataset.resolve), p_note: note || null });
    if (error) { b.disabled = false; flash('admMsg', t('err') + error.message); } else loadAdmin();
  });
}

/* ============ BOOT ============ */
(async function boot(){
  renderSocial();
  applyLang();
  if (!configured) { $('cfgWarn').textContent = t('cfgMissing'); $('cfgWarn').classList.remove('hide'); show('vAuth'); return; }
  if (!sb) {
    $('cfgWarn').textContent = t('sbFail'); $('cfgWarn').classList.remove('hide'); show('vAuth');
    $('fLogin').querySelector('button[type=submit]').disabled = true;
    $('fReg').querySelector('button[type=submit]').disabled = true;
    return;
  }
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && me.user) resetSession(); });
  try { await start(); } catch(e){ console.error(e); show('vAuth'); }
})();
});
</script>
<script>
(function(){
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone;
  if (standalone) return;
  var btn = document.getElementById('installBtn'), hint = document.getElementById('iosHint'), deferred = null;
  if (!btn) return;
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; btn.classList.remove('hide'); });
  window.addEventListener('appinstalled', function(){ deferred = null; btn.classList.add('hide'); hint.classList.add('hide'); });
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) btn.classList.remove('hide');
  btn.addEventListener('click', function(){
    if (deferred) {
      deferred.prompt();
      deferred.userChoice.then(function(){ deferred = null; btn.classList.add('hide'); });
    } else {
      hint.classList.remove('hide');
    }
  });
})();
</script>
