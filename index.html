<!DOCTYPE html>

<head>

<title>KLANDO</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
<style>
:root{
  --g:#ff8a00; --g2:#fff1df; --y:#ff8a00; --r:#c0392b;
  --t:#151515; --m:#626262; --b:#e7e7e7; --bg:#f7f7f7;
  --klando-orange:#ff8a00; --klando-black:#151515;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
header{background:#151515;color:#fff;padding:14px 22px;min-height:68px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:1000;border-bottom:3px solid var(--klando-orange);box-shadow:0 4px 18px rgba(0,0,0,.12)}
header h1{margin:0;font-size:25px;letter-spacing:2px;flex:1;color:#fff;font-weight:900;min-width:0}
header h1 small{display:block;font-size:11px;font-weight:500;letter-spacing:.5px;color:#ccc;margin-top:2px}
.brand-accent{color:var(--klando-orange)}
header button{background:var(--klando-orange);color:#151515;border:1px solid var(--klando-orange);border-radius:12px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
header button:hover{background:#ffa329}
#langBtn{min-width:46px;font-weight:900}
main{max-width:1100px;margin:24px auto;padding:16px}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:20px;padding:22px;margin-bottom:20px;box-shadow:0 8px 26px rgba(0,0,0,.05)}
.card h2{margin:0 0 16px;font-size:19px;font-weight:800;color:#151515}
label{display:block;font-size:13px;font-weight:650;color:#555;margin:15px 0 4px}
input,select{width:100%;padding:14px;border:1px solid #dcdcdc;border-radius:12px;font-size:16px;background:#fcfcfc;transition:border-color .2s,box-shadow .2s;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--klando-orange);box-shadow:0 0 0 3px rgba(255,138,0,.16)}
button{cursor:pointer;font-family:inherit;transition:transform .18s,box-shadow .18s,background .18s}
button:disabled{opacity:.55;cursor:not-allowed;transform:none!important}
button.btn{background:var(--klando-orange);color:#151515;border:0;border-radius:12px;padding:14px 18px;font-size:15px;font-weight:750;width:100%;margin-top:14px;box-shadow:0 5px 12px rgba(255,138,0,.18)}
button.btn:hover:not(:disabled){background:#ffa329;transform:translateY(-1px);box-shadow:0 8px 18px rgba(255,138,0,.24)}
button.btn.alt{background:#151515;color:#fff;border:1px solid #151515;box-shadow:none}
button.btn.alt:hover:not(:disabled){background:#333}
button.btn.red{background:var(--r);color:#fff}
button.btn.sm{width:auto;padding:9px 13px;font-size:13px;margin:6px 6px 0 0}
.row{display:flex;gap:8px}.row>*{flex:1}
.tabs{display:flex;gap:9px;margin-bottom:10px}
.tabs button{flex:1;padding:12px;border:1px solid var(--b);background:#fff;border-radius:12px;font-size:14px;font-weight:650}
.tabs button.on{background:var(--klando-orange);color:#151515;border-color:var(--klando-orange)}
.map{height:330px;border-radius:16px;border:1px solid #dce7df;overflow:hidden;margin:8px 0}
.msg{padding:13px;border-radius:12px;margin:8px 0;font-size:14px}
.msg.err{background:#fdecea;color:#8a1f13}.msg.ok{background:#edf7ef;color:#205b31}.msg.warn{background:#fff6dd;color:#7a5b00}
.pill{display:inline-block;padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;background:#eee;color:#444;white-space:nowrap}
.pill.pending{background:#fff1df;color:#8a4b00}.pill.accepted,.pill.approved{background:#dcefff;color:#0a4a82}
.pill.ongoing{background:#e8dcff;color:#4a2a8a}.pill.completed{background:#edf7ef;color:#205b31}
.pill.cancelled,.pill.rejected{background:#fdecea;color:#8a1f13}
.item{border-top:1px solid #edf1ee;padding:15px 2px;font-size:14px}.item:first-child{border-top:0}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.muted{color:var(--m);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--g2);border:1px solid #ffd5a3;border-radius:15px;padding:16px 8px;text-align:center}
.stat b{display:block;font-size:25px;color:#151515}.stat span{font-size:11px;color:var(--m)}
.hide{display:none!important}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fare{font-size:27px;font-weight:850;color:#e87900}
#vAuth .card{max-width:520px;margin:35px auto}
#vAuth .tabs{margin-bottom:22px}
.hero{background:linear-gradient(125deg,#111 0%,#242424 100%);color:#fff;padding:32px 28px;border-radius:22px;margin-bottom:25px;box-shadow:0 12px 28px rgba(0,0,0,.16)}
.hero-label{color:var(--klando-orange);font-weight:800;font-size:11px;letter-spacing:2px}
.hero h2{color:#fff;font-size:clamp(27px,5vw,40px);line-height:1.15;margin:15px 0}
.hero h2 span{color:var(--klando-orange)}
.hero p{max-width:580px;color:rgba(255,255,255,.85);line-height:1.7;margin:0}
.home-heading{padding:12px 4px 18px}
.home-heading span{color:#e87900;font-size:11px;font-weight:800;letter-spacing:2px}
.home-heading h2{font-size:clamp(25px,5vw,36px);margin:10px 0 5px;color:#151515}
.home-heading p{color:var(--m);margin:0}
.home-map{height:55vh;min-height:340px;border-radius:20px;border:1px solid #dce7df;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.10)}
.booking-panel{position:relative;background:#fff;border-radius:20px;padding:22px;margin:-25px 12px 0;z-index:500;box-shadow:0 8px 25px rgba(0,0,0,.12);border-top:4px solid var(--klando-orange)}
.booking-panel h3{margin-top:0;color:#151515}
.booking-panel p{color:var(--m)}
.footer{background:#151515;color:#fff;text-align:center;padding:32px 15px;margin-top:40px;border-top:4px solid var(--klando-orange)}
.footer h2{letter-spacing:3px;font-size:25px;color:var(--klando-orange);margin:0 0 8px}
.footer p{color:#e5e5e5;margin:0}
.footer div{color:var(--klando-orange);font-weight:700;margin:12px}
.footer small{color:#bbb}
/* Keep Leaflet controls inside their map and below the sticky header */
.leaflet-control-container,.leaflet-top,.leaflet-bottom{z-index:400!important}
.leaflet-control-attribution{max-width:calc(100% - 12px);font-size:10px}
@media (min-width:850px){
  #vCust{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:start}
  #vDrv{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  #vDrv>.card:first-child{grid-column:1/-1}
  #vAdm{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  #vAdm>.card{margin-bottom:0}
  #vAdm>#admMsg{grid-column:1/-1}
}
@media (max-width:600px){
  header{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;padding:11px 14px;min-height:64px}
  header h1{font-size:23px;line-height:1.15;letter-spacing:1.5px}
  header h1 small{font-size:10px;line-height:1.25;white-space:normal}
  header button{padding:8px 10px;font-size:12px;border-radius:10px}
  main{padding:12px;margin:12px auto}
  .card{padding:17px;border-radius:17px}
  .map{height:270px}
  .home-map{height:52vh;min-height:300px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .row{gap:6px}
  .hero{padding:24px 20px}
  .leaflet-control-attribution{font-size:9px;line-height:1.2}
}
/* ---- Live ride tracking, steps, toasts ---- */
#liveCard{grid-column:1/-1}
.steps{display:flex;gap:6px;margin:10px 0 14px}
.step{flex:1;text-align:center;font-size:11px;color:var(--m);line-height:1.25}
.step i{display:flex;width:28px;height:28px;margin:0 auto 5px;border-radius:50%;background:#eee;color:#555;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:12px}
.step.done i{background:#151515;color:#fff}
.step.cur i{background:var(--klando-orange);color:#151515;box-shadow:0 0 0 4px rgba(255,138,0,.25)}
.step.cur span{color:#151515;font-weight:700}
.live-line{font-size:17px;font-weight:700;margin:6px 0 4px}
.call{display:inline-block;margin:6px 8px 6px 0;padding:9px 14px;border-radius:12px;background:#151515;color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.mk{font-size:26px;line-height:36px;text-align:center;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
#toasts{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:3000;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{pointer-events:auto;background:#151515;color:#fff;border-left:5px solid var(--klando-orange);border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:2px;font-size:14px;animation:tin .25s ease}
.toast b{color:var(--klando-orange);font-size:15px}
.toast.ok{border-left-color:#2ecc71}.toast.warn{border-left-color:#f1c40f}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<script>
/* Load map and database libraries with CDN fallbacks; the app starts once both attempts finish. */
(function () {
  function loadScript(url) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = url; s.onload = resolve;
      s.onerror = () => reject(new Error('Could not load ' + url));
      document.head.appendChild(s);
    });
  }
  async function loadWithFallback(primary, fallback) {
    try { await loadScript(primary); return true; }
    catch (e1) {
      try { await loadScript(fallback); return true; }
      catch (e2) { console.error(e1, e2); return false; }
    }
  }
  (async () => {
    const [leafletOK, supabaseOK] = await Promise.all([
      loadWithFallback('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js','https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js'),
      loadWithFallback('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://unpkg.com/@supabase/supabase-js@2')
    ]);
    window.KLANDO_DEPENDENCIES = { leafletOK, supabaseOK };
    document.dispatchEvent(new Event('klando-dependencies-ready'));
  })();
})();
</script>

function applyLang(){

  if (me.user) { renderAvail(); refresh(); }

/* Re-render a container without losing what the user is typing (the 10 s refresh used to wipe inputs). */
function keepInputs(container, render){
  const vals = {};
  container.querySelectorAll('input[id]').forEach(i => { vals[i.id] = i.value; });
  const act = document.activeElement;
  const actId = act && container.contains(act) ? act.id : null;
  const selStart = actId && act.selectionStart != null ? act.selectionStart : null;
  render();
  Object.keys(vals).forEach(id => { const el = document.getElementById(id); if (el && vals[id]) el.value = vals[id]; });
  if (actId) { const el = document.getElementById(actId); if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch(e){} } }
}

function mkMap(id){
  if (!window.L) {
    const el = $(id);
    if (el && !el.querySelector('.msg')) el.innerHTML = `<div class="msg warn">${esc(t('mapFail'))}</div>`;
    return null;
  }
  if (maps[id]) { setTimeout(()=>maps[id].invalidateSize(),150); return maps[id]; }
  const m = L.map(id).setView(CITY_CENTER, 13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(m);
  maps[id] = m; setTimeout(()=>m.invalidateSize(),150); return m;
}
function show(v){
  ['vAuth','vCust','vDrv','vAdm'].forEach(x => $(x).classList.toggle('hide', x !== v));
  $('publicHero').classList.toggle('hide', v !== 'vAuth');
  $('publicHome').classList.toggle('hide', v !== 'vAuth');
  $('logoutBtn').classList.toggle('hide', v === 'vAuth');
  window.scrollTo({ top: 0 });
  if (v === 'vAuth') setTimeout(() => mkMap('mapHome'), 200);
}
const dist = (a,b) => {
  const R=6371, r=x=>x*Math.PI/180, dLa=r(b[0]-a[0]), dLo=r(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
};
const calcFare = km => {
  const r = isNight() ? FARE.night : FARE.day;
  const raw = Math.round((FARE.base + FARE.perKm*km*1.3)/FARE.step)*FARE.step;
  return Math.min(r.max, Math.max(r.min, raw));
};

/* ============ LOADING THE USER ============ */
async function start(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return show('vAuth');
  me.user = session.user;
  const md = me.user.user_metadata || {};
  const pr = await sb.from('profiles').select('*').eq('id', me.user.id).maybeSingle();
  me.profile = pr.data || null;
  let dr = await sb.from('drivers').select('*').eq('user_id', me.user.id).maybeSingle();
  me.driver = dr.data || null;
  if (!me.driver && md.want_driver && (!me.profile || me.profile.role !== 'admin')) {
    const ins = await sb.from('drivers').insert({
      user_id: me.user.id, display_name: md.display_name || me.user.email, phone: md.phone || null,
      vehicle: md.vehicle || null, vehicle_plate: md.vehicle_plate || null,
      approval_status: 'pending', is_available: false }).select().maybeSingle();
    if (ins.error) flash('globalMsg', t('err') + ins.error.message); else me.driver = ins.data;
  }
  const pRole = me.profile && me.profile.role;
  me.role = pRole === 'admin' ? 'admin' : (me.driver || pRole === 'driver') ? 'driver' : 'customer';
  if (me.role === 'admin') { show('vAdm'); mkMap('mapA'); }
  else if (me.role === 'driver') show('vDrv');
  else { show('vCust'); initCustomer(); }
  applyLang();
  scheduleRefresh();
}
function stopAll(){
  clearTimeout(timer); clearInterval(gpsPushTimer);
  if (gpsWatch != null && navigator.geolocation) navigator.geolocation.clearWatch(gpsWatch);
  gpsWatch = null; gpsPushTimer = null; timer = null;
}
/* Adaptive polling: every 4 s while a customer has a live ride, every 10 s otherwise. */
function scheduleRefresh(){
  clearTimeout(timer);
  timer = setTimeout(async () => { await refresh(); if (me.user) scheduleRefresh(); }, liveActive ? LIVE_MS : REFRESH_MS);
}
async function refresh(){
  if (!me.user || refreshing) return;
  refreshing = true;
  try {
    if (me.role === 'customer') { updateFare(); await loadCustomer(); } // updateFare also flips day/night rate on time
    else if (me.role === 'driver') await loadDriver();
    else if (me.role === 'admin') await loadAdmin();
  } catch(e){ console.error(e); }
  finally { refreshing = false; }
}
// Refresh immediately when the user comes back to the tab, instead of waiting for the next tick.
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

/* ============ CUSTOMER ============ */
const C = { pick:null, dest:null, mode:'p', mk:{}, ready:false, destQuery:'' };
let destinationLookup = 0, destPromise = null, destPromiseQ = '';

function setMode(m){ C.mode = m; $('modeP').classList.toggle('on', m==='p'); $('modeD').classList.toggle('on', m==='d'); }
$('modeP').onclick = () => setMode('p');

function placeMarker(kind, ll){
  const m = maps.mapC; if (!m) return;
  if (C.mk[kind]) m.removeLayer(C.mk[kind]);
  C.mk[kind] = L.marker(ll).addTo(m).bindPopup(kind==='p'?t('setPickup'):t('setDest'));
  updateFare();
}
function updateFare(){
  $('fare').textContent = (C.pick && C.dest) ? money(calcFare(dist(C.pick, C.dest))) : '—';
  const r = isNight() ? FARE.night : FARE.day;
  $('fareNote').textContent = `${t(isNight() ? 'nightRate' : 'dayRate')} : ${r.min.toLocaleString('fr-FR')} – ${r.max.toLocaleString('fr-FR')} FCFA`;
}

async function geocodeDestination(query){
  const q = query.trim();
  if (!q) return false;
  const lookupId = ++destinationLookup;
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=td&q='
      + encodeURIComponent(q + ", N'Djamena");
    const response = await fetch(url, { headers: { 'Accept-Language': lang } });
    if (!response.ok) throw new Error('Geocoding service unavailable');
    const results = await response.json();
    if (lookupId !== destinationLookup) return false; // a newer search superseded this one
    if (!results.length) {
      C.dest = null; C.destQuery = '';
      if (C.mk.d && maps.mapC) { maps.mapC.removeLayer(C.mk.d); C.mk.d = null; }
      updateFare(); flash('custMsg', t('noPos'), 'warn');
      return false;
    }
    C.dest = [parseFloat(results[0].lat), parseFloat(results[0].lon)];
    C.destQuery = q;
    placeMarker('d', C.dest);
    if (maps.mapC) maps.mapC.setView(C.dest, 14);
    flash('custMsg', '');
    return true;
  } catch(error) {
    if (lookupId === destinationLookup) { C.dest = null; C.destQuery = ''; updateFare(); flash('custMsg', t('noPos'), 'warn'); }
    return false;
  }
}
/* Single entry point: reuses a lookup already in flight, so blur + click never run two searches. */
function ensureDestination(q){
  if (C.dest && C.destQuery === q) return Promise.resolve(true);
  if (destPromise && destPromiseQ === q) return destPromise;
  destPromiseQ = q;
  const p = geocodeDestination(q).finally(() => { if (destPromise === p) destPromise = null; });
  destPromise = p;
  return p;
}

function initCustomer(){
  const m = mkMap('mapC');
  if (!m || C.ready) return;
  C.ready = true;
  m.on('click', ev => {
    const ll = [ev.latlng.lat, ev.latlng.lng];
    if (C.mode === 'p') {
      C.pick = ll; placeMarker('p', ll);
      if (!$('cPick').value.trim()) $('cPick').value = t('mapPoint');
      setMode('d');
    } else {
      C.dest = ll;
      // Label the map-selected destination so it is valid without a text search.
      $('cDest').value = t('mapPoint');
      C.destQuery = t('mapPoint');
      placeMarker('d', ll);
      flash('custMsg','');
    }
  });
}

$('gpsBtn').onclick = () => {
  if (!navigator.geolocation) return flash('custMsg', t('gpsDenied'), 'warn');
  const btn = $('gpsBtn'); busy(btn, true);
  navigator.geolocation.getCurrentPosition(p => {
    busy(btn, false);
    C.pick = [p.coords.latitude, p.coords.longitude];
    placeMarker('p', C.pick);
    if (maps.mapC) maps.mapC.setView(C.pick, 15);
    if (!$('cPick').value.trim()) $('cPick').value = t('myGps');
    setMode('d'); flash('custMsg','');
  }, () => { busy(btn, false); flash('custMsg', t('gpsDenied'), 'warn'); }, { enableHighAccuracy:true, timeout:10000 });
};

$('searchBtn').onclick = async () => {

$('reqBtn').onclick = async () => {
  flash('custMsg','');
  if (!C.pick) return flash('custMsg', t('needPick'));
  const dest = $('cDest').value.trim();
  if (!dest) return flash('custMsg', t('needDest'));
  requestNotifPermission();
  const btn = $('reqBtn'); busy(btn, true);
  try {
    // A valid destination is mandatory; never submit with a guessed minimum fare.
    if (!C.dest || C.destQuery !== dest) {
      const ok = await ensureDestination(dest);
      if (!ok || !C.dest || C.destQuery !== dest) return flash('custMsg', t('noPos'), 'warn');
    }
    const fare = calcFare(dist(C.pick, C.dest));
    const name = (me.profile && me.profile.display_name) || (me.user.user_metadata||{}).display_name || me.user.email;
    const { error } = await sb.from('rides').insert({
      customer_id: me.user.id, customer_name: name,

/* ============ NOTIFICATIONS ============ */
function beep(){
  try {
    const ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination); o.frequency.value = 880;
    g.gain.setValueAtTime(.001, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.25, ac.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .5);
    o.start(); o.stop(ac.currentTime + .5);
  } catch(e){}
}
function requestNotifPermission(){
  try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch(e){}
}
/* In-app banner + sound + vibration; a system notification too when the tab is in the background. */
function notify(title, body, kind){
  const d = document.createElement('div');
  d.className = 'toast ' + (kind || '');
  d.innerHTML = `<b>${esc(title)}</b><span>${esc(body)}</span>`;
  d.onclick = () => d.remove();
  $('toasts').appendChild(d);
  setTimeout(() => d.remove(), 12000);
  beep();
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch(e){}
  try { if (document.hidden && 'Notification' in window && Notification.permission === 'granted') new Notification(title, { body }); } catch(e){}
}

/* ============ LIVE RIDE (customer) ============ */
const seen = {}, geoArrived = {};
const LIVE = { rideId:null, pick:null, dest:null, drv:null, fit:null, dismissed:{} };
const ARRIVE_KM = 0.1, MOTO_KMH = 25;
const eta = km => Math.max(1, Math.round(km / MOTO_KMH * 60));
const ll = (a, b) => [Number(a), Number(b)];
const hasPos = (a, b) => a != null && b != null && !isNaN(Number(a)) && !isNaN(Number(b));

function pickLive(rides){
  const act = rides.find(r => ['pending','accepted','ongoing'].includes(r.status));
  if (act) return act;
  return rides.find(r => r.status === 'completed' && !LIVE.dismissed[r.id] && Date.now() - new Date(r.created_at) < 12*3600*1000) || null;
}
async function fetchDriver(r){
  let res = await sb.rpc('get_klando_ride_driver', { p_ride_id: r.id });
  const d = Array.isArray(res.data) ? res.data[0] : res.data;
  if (!res.error && d) return d;
  if (r.driver_id) {   // fallback when the database function is not installed
    const q = await sb.from('drivers').select('display_name,phone,vehicle,vehicle_plate,latitude,longitude').or(`id.eq.${r.driver_id},user_id.eq.${r.driver_id}`).maybeSingle();
    if (q.data) return q.data;
  }
  return null;
}
/* Compare each ride with what we saw last time and alert on changes (the first load only sets the baseline). */
function checkEvents(r){
  const prev = seen[r.id], cur = { status:r.status, arrived:!!r.arrived_at, pay:r.payment_status };
  if (prev) {
    if (prev.status !== cur.status) {
      if (cur.status === 'accepted') notify(t('nAcceptedT'), t('nAcceptedB'));
      else if (cur.status === 'ongoing') notify(t('nOngoingT'), t('nOngoingB'));
      else if (cur.status === 'completed') notify(t('nDoneT'), t('nDoneB').replace('{amount}', money(finalFare(r))).replace('{method}', payLabel(r.payment_method)), 'ok');
      else if (cur.status === 'cancelled') notify(t('nCancelT'), t('nCancelB'), 'warn');
    }
    if (!prev.arrived && cur.arrived && r.status === 'accepted' && !geoArrived[r.id]) notify(t('nArrivedT'), t('nArrivedB'));
    if (prev.pay !== cur.pay && cur.pay === 'paid') notify(t('nPaidT'), t('nPaidB'), 'ok');
  }
  seen[r.id] = cur;
}
async function updateLive(rides){
  try {
    const live = pickLive(rides);
    liveRideId = live ? live.id : null;
    liveActive = !!live && ['pending','accepted','ongoing'].includes(live.status);
    let driver = null;
    if (live && ['accepted','ongoing','completed'].includes(live.status)) {
      driver = await fetchDriver(live);
      // Automatic arrival alert when the driver is within 100 m of the pickup point.
      if (driver && live.status === 'accepted' && !live.arrived_at && !geoArrived[live.id]
          && hasPos(driver.latitude, driver.longitude) && hasPos(live.pickup_lat, live.pickup_lng)
          && dist(ll(driver.latitude, driver.longitude), ll(live.pickup_lat, live.pickup_lng)) < ARRIVE_KM) {
        geoArrived[live.id] = true;
        if (seen[live.id]) notify(t('nArrivedT'), t('nArrivedB'));
      }
    }
    rides.forEach(checkEvents);
    renderLive(live, driver);
  } catch(e){ console.error(e); }
}
const dIcon = emoji => L.divIcon({ html:`<div class="mk">${emoji}</div>`, className:'', iconSize:[36,36], iconAnchor:[18,18] });
function updateLiveMap(m, r, dpos){
  if (LIVE.rideId !== r.id) {
    ['pick','dest','drv'].forEach(k => { if (LIVE[k]) { m.removeLayer(LIVE[k]); LIVE[k] = null; } });
    LIVE.rideId = r.id; LIVE.fit = null;
    if (hasPos(r.pickup_lat, r.pickup_lng)) LIVE.pick = L.marker(ll(r.pickup_lat, r.pickup_lng), { icon:dIcon('📍') }).addTo(m).bindPopup(esc(t('pickup')));
    if (hasPos(r.destination_lat, r.destination_lng)) LIVE.dest = L.marker(ll(r.destination_lat, r.destination_lng), { icon:dIcon('🏁') }).addTo(m).bindPopup(esc(t('destination')));
  }
  if (dpos) { if (!LIVE.drv) LIVE.drv = L.marker(dpos, { icon:dIcon('🏍️'), zIndexOffset:1000 }).addTo(m); else LIVE.drv.setLatLng(dpos); }
  else if (LIVE.drv) { m.removeLayer(LIVE.drv); LIVE.drv = null; }
  const pts = [];
  if (hasPos(r.pickup_lat, r.pickup_lng)) pts.push(ll(r.pickup_lat, r.pickup_lng));
  if (hasPos(r.destination_lat, r.destination_lng)) pts.push(ll(r.destination_lat, r.destination_lng));
  if (dpos) pts.push(dpos);
  const key = dpos ? 'with-driver' : 'no-driver';   // re-fit once when the driver first appears, then leave the view alone
  if (pts.length && LIVE.fit !== key) { m.fitBounds(pts, { padding:[40,40], maxZoom:16 }); LIVE.fit = key; }
}
function payBlock(r){
  const id = esc(r.id), amt = money(finalFare(r)), mobile = !!PAY[r.payment_method];
  let h = '';
  if (r.payment_status === 'paid') h = `<div class="msg ok">✔ ${esc(t('payPaid').replace('{amount}', amt))}</div>`;
  else if (mobile && ['unpaid','failed'].includes(r.payment_status)) h = `<div class="msg warn">${transferText(r)}</div><label for="lref-${id}">${t('referenceLabel')}</label><input id="lref-${id}" maxlength="100" placeholder="${esc(t('referencePlaceholder'))}"><button class="btn alt sm" data-live-pay="${id}">${t('sendReference')}</button>`;
  else if (mobile && r.payment_status === 'awaiting_verification') h = `<div class="msg warn">${t('payAwaiting')}</div>`;
  else if (!mobile && r.status === 'completed') h = `<div class="msg warn">${esc(t('payCash').replace('{amount}', amt))}</div>`;
  else if (!mobile) h = `<div class="muted">${t('payment')}: ${t('cash')}</div>`;
  if (r.status === 'completed') h += `<button class="btn alt sm" data-live-close="${id}">${t('close')}</button>`;
  return h;
}
function renderLive(r, d){
  const card = $('liveCard');
  if (!r) { card.classList.add('hide'); return; }
  const wasHidden = card.classList.contains('hide');
  card.classList.remove('hide');
  const arrived = !!r.arrived_at || !!geoArrived[r.id];
  const idx = r.status === 'pending' ? 0 : r.status === 'accepted' ? (arrived ? 2 : 1) : r.status === 'ongoing' ? 3 : 4;
  $('liveSteps').innerHTML = ['stReq','stRoute','stArrived','stRide','stDone'].map((k,i) =>
    `<div class="step ${i < idx ? 'done' : i === idx ? 'cur' : ''}"><i>${i < idx ? '✓' : i + 1}</i><span>${t(k)}</span></div>`).join('');
  $('livePill').innerHTML = pill(r.status);

  const dpos = d && hasPos(d.latitude, d.longitude) && r.status !== 'completed' ? ll(d.latitude, d.longitude) : null;
  let line;
  if (r.status === 'pending') line = t('liveWaiting');
  else if (r.status === 'accepted') {
    if (arrived) line = t('liveArrived');
    else if (dpos && hasPos(r.pickup_lat, r.pickup_lng)) { const km = dist(dpos, ll(r.pickup_lat, r.pickup_lng)); line = t('liveComing').replace('{min}', eta(km)).replace('{km}', km.toFixed(1)); }
    else line = t('liveComingNoPos');
  } else if (r.status === 'ongoing') {
    if (dpos && hasPos(r.destination_lat, r.destination_lng)) { const km = dist(dpos, ll(r.destination_lat, r.destination_lng)); line = t('liveOngoing').replace('{min}', eta(km)).replace('{km}', km.toFixed(1)); }
    else line = t('liveOngoingNoPos');
  } else line = t('liveDone');

  let who = '';
  if (d && d.display_name) {
    const tel = String(d.phone || '').replace(/[^0-9+]/g, '');
    who = `<div class="muted"><b>${esc(d.display_name)}</b> · ${esc(d.vehicle || '')} ${esc(d.vehicle_plate || '')}</div>` + (tel ? `<a class="call" href="tel:${esc(tel)}">${t('call')}</a>` : '');
  }
  $('liveInfo').innerHTML = `<div class="live-line">${esc(line)}</div>${who}
    <div class="sw" style="margin-top:8px"><span>${t(r.status === 'completed' ? 'finalFare' : 'liveFare')}</span><span class="fare">${money(finalFare(r))}</span></div>`;

  const m = mkMap('mapLive');
  if (m) { if (wasHidden) setTimeout(() => m.invalidateSize(), 200); updateLiveMap(m, r, dpos); }

  keepInputs($('livePay'), () => { $('livePay').innerHTML = payBlock(r); });
  document.querySelectorAll('[data-live-pay]').forEach(b => b.onclick = async () => {
    const id = b.dataset.livePay, ref = ($(`lref-${id}`).value || '').trim();
    if (!ref) return flash('liveMsg', t('enterReference'), 'warn');
    b.disabled = true;
    const { error } = await submitPayment(id, ref);
    if (error) { b.disabled = false; flash('liveMsg', t('err') + error.message); }
    else { flash('liveMsg', t('referenceSent'), 'ok'); loadCustomer(); }
  });
  document.querySelectorAll('[data-live-close]').forEach(b => b.onclick = () => { LIVE.dismissed[b.dataset.liveClose] = true; flash('liveMsg', ''); loadCustomer(); });
}

/* ============ DRIVER ============ */
function renderAvail(){
  if (!me.driver || !$('availBtn')) return;
  const on = !!me.driver.is_available;
  $('availBtn').textContent = on ? t('goOff') : t('goOn');
  $('availBtn').className = 'btn sm' + (on ? ' red' : '');
}
$('availBtn').onclick = async () => {
  const btn = $('availBtn'); busy(btn, true);
  try {
    const next = !me.driver.is_available;
    const { error } = await sb.rpc('set_klando_driver_availability', { p_available: next });
    if (error) return flash('drvMsg', t('err') + error.message);
    me.driver.is_available = next; renderAvail(); manageGps(); loadDriver();
  } finally { busy(btn, false); }
};
function manageGps(){
  // Keep sending the position during an accepted/ongoing ride, even if the driver is no longer "available".
  const need = me.driver && me.driver.approval_status === 'approved' && (me.driver.is_available || drvActive);
  if (need && gpsWatch == null && navigator.geolocation) {
    gpsWatch = navigator.geolocation.watchPosition(p => { lastPos = [p.coords.latitude, p.coords.longitude]; },
      () => flash('drvMsg', t('gpsDenied'), 'warn'), { enableHighAccuracy:true, maximumAge:10000 });
    gpsPushTimer = setInterval(pushGps, GPS_PUSH_MS); setTimeout(pushGps, 3000);
  } else if (!need) {
    if (gpsWatch != null && navigator.geolocation) navigator.geolocation.clearWatch(gpsWatch);
    gpsWatch = null; clearInterval(gpsPushTimer); gpsPushTimer = null;
  }
}
async function pushGps(){
  if (!lastPos) return;
  const { error } = await sb.rpc('update_klando_driver_location', { p_lat:lastPos[0], p_lng:lastPos[1] });
  if (error && !gpsFnWarned) { gpsFnWarned = true; console.warn(error); flash('drvMsg', t('gpsNoFn'), 'warn'); }
}
async function loadDriver(){
  const dr = await sb.from('drivers').select('*').eq('user_id', me.user.id).maybeSingle();
  if (dr.data) me.driver = dr.data;
  const d = me.driver;
  if (!d) { $('drvInfo').innerHTML = `<div class="msg warn">${t('drvNone')}</div>`; $('drvSwitch').classList.add('hide'); return; }
  const st = d.approval_status;
  $('drvInfo').innerHTML = `<div>${pill(st)} <b>${esc(d.display_name)}</b></div><div class="muted">${esc(d.vehicle||'')} ${esc(d.vehicle_plate||'')}</div>
    <div class="msg ${st==='approved'?'ok':st==='rejected'?'err':'warn'}">${t(st==='approved'?'drvApproved':st==='rejected'?'drvRejected':'drvPending')}</div>`;
  $('drvSwitch').classList.toggle('hide', st !== 'approved'); renderAvail(); manageGps();
  if (st !== 'approved') { $('drvMine').innerHTML = $('drvPending').innerHTML = `<p class="muted">${t('noReq')}</p>`; return; }
  const mine = await sb.from('rides').select('*').or(`driver_id.eq.${d.id},driver_id.eq.${me.user.id}`).order('created_at',{ascending:false}).limit(20);
  drvActive = (mine.data||[]).some(r => ['accepted','ongoing'].includes(r.status));
  manageGps();
  $('drvMine').innerHTML = (mine.data||[]).map(r => {
    let a = '';
    if (r.status==='accepted') {
      if (!r.arrived_at) a += `<button class="btn alt sm" data-arrived="${esc(r.id)}">📍 ${t('iArrived')}</button>`;
      a += `<button class="btn sm" data-adv="${esc(r.id)}|ongoing">${t('start')}</button>`;
    }
    if (r.status==='ongoing') a = `<button class="btn sm" data-adv="${esc(r.id)}|completed">${t('finish')}</button>`;
    if (r.status==='completed' && !PAY[r.payment_method] && r.payment_status !== 'paid') a = `<button class="btn sm" data-cash="${esc(r.id)}">💵 ${t('iCash')}</button>`;
    return rideHtml(r, a);
  }).join('') || `<p class="muted">${t('noRides')}</p>`;
  // Oldest request first, so the customer who has waited longest is served first.
  const pend = await sb.from('rides').select('*').eq('status','pending').order('created_at',{ascending:true}).limit(30);
  $('drvPending').innerHTML = d.is_available
    ? ((pend.data||[]).map(r => rideHtml(r, `<button class="btn sm" data-acc="${esc(r.id)}">${t('accept')}</button>`)).join('') || `<p class="muted">${t('noReq')}</p>`)
    : `<p class="muted">${t('goOn')}</p>`;
  document.querySelectorAll('[data-arrived]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { error } = await sb.rpc('klando_driver_arrived', { p_ride_id: b.dataset.arrived });
    if (error) { b.disabled = false; const miss = isMissingFn(error); flash('drvMsg', miss ? t('arrivedNoFn') : t('err') + error.message, miss ? 'warn' : 'err'); }
    else { flash('drvMsg', t('arrivedSent'), 'ok'); loadDriver(); }
  });
  document.querySelectorAll('[data-cash]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { error } = await sb.rpc('confirm_klando_cash', { p_ride_id: b.dataset.cash });
    if (error) { b.disabled = false; flash('drvMsg', t('err') + error.message); }
    else { flash('drvMsg', t('cashDone'), 'ok'); loadDriver(); }
  });
  document.querySelectorAll('[data-acc]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const { error } = await sb.rpc('accept_klando_ride', { p_ride_id: b.dataset.acc });
    if (error) { b.disabled = false; flash('drvMsg', t('err') + error.message); } else { flash('drvMsg',''); loadDriver(); }
  });
  document.querySelectorAll('[data-adv]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const [id, st2] = b.dataset.adv.split('|');
    const { error } = await sb.rpc('update_klando_ride_status', { p_ride_id: id, p_new_status: st2 });
    if (error) { b.disabled = false; flash('drvMsg', t('err') + error.message); } else { flash('drvMsg',''); loadDriver(); }
  });
}

  $('admRides').innerHTML = rides.slice(0,40).map(x => rideHtml(x)).join('') || `<p class="muted">${t('noRides')}</p>`;
  const awaiting = rides.filter(x => PAY[x.payment_method] && x.payment_status==='awaiting_verification');
  $('admPayments').innerHTML = awaiting.map(x => `<div class="item"><b>${esc(x.customer_name || t('clientName'))}</b><div>${esc(x.pickup_address)} → ${esc(x.destination)}</div><div class="muted">${esc(payLabel(x.payment_method))} · ${t('amount')}: ${money(finalFare(x))} · ${t('reference')}: ${esc(x.payment_reference || '—')}</div><button class="btn sm" data-verify-payment="${esc(x.id)}">${t('confirmPayment')}</button></div>`).join('') || `<p class="muted">${t('noPayment')}</p>`;
  document.querySelectorAll('[data-verify-payment]').forEach(b => b.onclick = async () => {
    if (!confirm(t('confirmReceived'))) return;
    b.disabled=true;
    const { error } = await verifyPayment(b.dataset.verifyPayment);
    if (error) { b.disabled=false; flash('admMsg',t('err')+error.message); }
    else { flash('admMsg',t('paymentConfirmed'),'ok'); loadAdmin(); }
  });
  document.querySelectorAll('[data-ap]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const [id, s] = b.dataset.ap.split('|');
    const { error } = await sb.from('drivers').update({ approval_status: s }).eq('id', id);
    if (error) { b.disabled = false; flash('admMsg', t('err') + error.message); } else { flash('admMsg',''); loadAdmin(); }
  });
  const m = mkMap('mapA');
  if (!m) return;
  admMk.forEach(x => m.removeLayer(x)); admMk = [];
  drivers.filter(x => x.is_available && x.approval_status==='approved' && x.latitude != null && x.longitude != null)
    .forEach(x => admMk.push(L.marker([x.latitude, x.longitude]).addTo(m).bindPopup(esc(x.display_name))));
}

/* ============ BOOT ============ */
(async function boot(){
  applyLang();
  if (!configured) { $('cfgWarn').textContent = t('cfgMissing'); $('cfgWarn').classList.remove('hide'); show('vAuth'); return; }
  if (!sb) {
    $('cfgWarn').textContent = t('sbFail'); $('cfgWarn').classList.remove('hide'); show('vAuth');
    $('fLogin').querySelector('button[type=submit]').disabled = true;
    $('fReg').querySelector('button[type=submit]').disabled = true;
    return;
  }
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && me.user) resetSession(); });
  try { await start(); } catch(e){ console.error(e); show('vAuth'); }
})();
});
</script>
